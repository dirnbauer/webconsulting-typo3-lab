services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webconsulting\Flue\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Enum/*'

  # Bind the client interface to the HTTP implementation.
  Webconsulting\Flue\Service\FlueClientInterface: '@Webconsulting\Flue\Service\FlueClient'

  # Backend route + AJAX targets and the CLI-reachable trigger service must be public.
  Webconsulting\Flue\Controller\FlueModuleController:
    public: true
  Webconsulting\Flue\Controller\FlueApiController:
    public: true
  Webconsulting\Flue\Service\FlowTriggerService:
    public: true
