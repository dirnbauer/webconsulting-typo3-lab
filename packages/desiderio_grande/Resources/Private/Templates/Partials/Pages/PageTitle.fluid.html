<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:comment>
    The page-level h1. Every content element heads its own band with an h2, so
    this is the single h1 on a content page and it always says what the page
    is — the title in the page tree, the title in the tab, the title on screen.
</f:comment>

<div class="astryx-layout grande-page-header">
    <h1 class="grande-page-title">{page.pageRecord.title}</h1>
</div>

</html>
