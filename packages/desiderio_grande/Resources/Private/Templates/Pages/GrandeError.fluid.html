<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Pages/Default"/>

<f:comment>
    Error pages render whatever content an editor put on them; the heading and
    the way back home are part of the template so a bare error page is still
    useful.
</f:comment>

<f:section name="Main">
    <div class="astryx-layout">
        <div class="grande-error">
            <h1 class="grande-error__title">{page.pageRecord.title}</h1>
            <f:if condition="{page.pageRecord.abstract}">
                <p class="grande-error__body">{page.pageRecord.abstract}</p>
            </f:if>
            <a href="{f:uri.page(pageUid: site.rootPageId)}" class="astryx-button primary">
                <f:translate extensionName="desiderio_grande" key="chrome.home">Home</f:translate>
            </a>
        </div>
    </div>
    <!--TYPO3SEARCH_begin-->
    <f:if condition="{content.main}">
        <f:render.contentArea contentArea="{content.main}"/>
    </f:if>
    <!--TYPO3SEARCH_end-->
</f:section>

</html>
