<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The standalone search box (plugin "Search Form"), for dropping a field on a
    landing page that sends the visitor to the results page. Same partial as the
    results page uses, so the two fields behave identically — including the
    suggest dropdown.
</f:comment>

<f:layout name="Fullwidth"/>

<f:section name="content">
    <f:render
        partial="Search/Form"
        section="Form"
        arguments="{search: search, additionalFilters: additionalFilters, pluginNamespace: pluginNamespace, additionalVariables: additionalVariables}"
    />
</f:section>

</html>
