<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:argument name="resultSet" type="object"/>

<f:variable name="labels" value="LLL:EXT:desiderio_grande/Resources/Private/Language/labels.xlf"/>

<f:section name="PerPage">
    <f:comment>
        The select submits its form on change, which is the whole control — so
        the submit button is there for anyone whose JavaScript never arrives,
        and hidden from everyone else by the stylesheet.
    </f:comment>
    <form id="results-per-page" method="post" action="{s:uri.search.currentSearch()}" class="astryx-field horizontal g-search__per-page">
        <label class="astryx-field-label" for="results-per-page-select">
            <f:translate key="{labels}:search.perPage" default="Per page"/>
        </label>

        <select
            id="results-per-page-select"
            class="astryx-selector sm g-search__per-page-select"
            name="{resultSet.usedSearchRequest.argumentNameSpace}[resultsPerPage]"
            onchange="this.form.submit()"
        >
            <f:for each="{resultSet.usedSearchRequest.contextTypoScriptConfiguration.searchResultsPerPageSwitchOptionsAsArray}" as="perPage">
                <f:if condition="{perPage} == {resultSet.usedResultsPerPage}">
                    <f:then><option value="{perPage}" selected="selected">{perPage}</option></f:then>
                    <f:else><option value="{perPage}">{perPage}</option></f:else>
                </f:if>
            </f:for>
        </select>

        <noscript>
            <button class="astryx-button secondary sm" type="submit"><f:translate key="{labels}:search.perPageApply" default="Apply"/></button>
        </noscript>
    </form>
</f:section>

</html>
