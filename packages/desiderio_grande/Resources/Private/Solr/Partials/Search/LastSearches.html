<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:argument name="lastSearches" type="iterable" optional="true"/>

<f:section name="LastSearches">
    <f:comment>
        Declared inside the section, not above it: a template or partial that is
        rendered through a layout or by section name never evaluates its root
        content, so a variable set out there is simply absent by the time the
        section runs — and every key built from it silently loses its path.
    </f:comment>
    <f:variable name="labels" value="LLL:EXT:desiderio_grande/Resources/Private/Language/labels.xlf"/>

    <s:lastSearches>
        <f:if condition="{lastSearches}">
            <section class="astryx-card flat g-search__facet" aria-labelledby="tx-solr-lastsearches-label">
                <h2 class="astryx-card-title g-search__facet-title" id="tx-solr-lastsearches-label">
                    <f:translate key="{labels}:search.lastSearches" default="Recent searches"/>
                </h2>

                <ul class="astryx-list compact g-search__facet-list" id="tx-solr-lastsearches">
                    <f:for each="{lastSearches}" as="searchedFor">
                        <li>
                            <a href="{s:uri.search.startNewSearch(queryString: searchedFor)}" class="astryx-item compact interactive solr-ajaxified">
                                <span class="astryx-item-content">
                                    <span class="astryx-item-label truncate"><f:format.htmlentities>{searchedFor}</f:format.htmlentities></span>
                                </span>
                            </a>
                        </li>
                    </f:for>
                </ul>
            </section>
        </f:if>
    </s:lastSearches>
</f:section>

</html>
