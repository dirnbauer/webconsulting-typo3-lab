<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-logo-cloud" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Marks are normalised by optical area rather than by box height, and desaturated by default so one loud brand cannot unbalance the row.
</f:comment>

<section class="astryx-section g-logo-cloud" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
