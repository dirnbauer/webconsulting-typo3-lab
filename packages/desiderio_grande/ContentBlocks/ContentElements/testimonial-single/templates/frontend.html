<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-testimonial-single" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Quotation marks are drawn by the template; the field holds bare text. The typographic variant sets the quote at display size, the card variant boxes it.
</f:comment>

<section class="astryx-section g-testimonial-single" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
