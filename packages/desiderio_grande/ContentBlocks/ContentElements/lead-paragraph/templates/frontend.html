<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-lead-paragraph" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    The lead is a plain paragraph, not a heading at a smaller weight: it is the
    first sentence of the piece, and a screen reader that hears it announced as
    a heading loses the boundary between the title and the text.
</f:comment>

<section class="astryx-section g-lead-paragraph {data.tone}">
    <div class="astryx-layout {data.width}">
        <div class="g-lead-paragraph__body align-{data.align}">

            <f:if condition="{data.header}">
                <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
            </f:if>

            <p class="astryx-text large g-lead-paragraph__lead">{data -> f:render.text(field: 'lead')}</p>

        </div>
    </div>
</section>

</html>
