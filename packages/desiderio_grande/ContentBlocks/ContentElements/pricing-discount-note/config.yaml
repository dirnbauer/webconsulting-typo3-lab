name: desiderio-grande/pricing-discount-note
typeName: desiderio_grande_pricingdiscountnote
title: 'Discount & Eligibility Note'
description: 'Renders the reductions that depend on who is asking: nonprofit, education, startup, open source, public sector. Each entry gets an icon, the size of the reduction and a line on how to prove eligibility. Use it for: a nonprofit rate band under a pricing table, a student discount notice, a programme page for community projects. Prefer ''Launch Offer Price'' for a discount everyone gets, and ''Quote Request Panel'' when eligibility has to be assessed case by case.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
