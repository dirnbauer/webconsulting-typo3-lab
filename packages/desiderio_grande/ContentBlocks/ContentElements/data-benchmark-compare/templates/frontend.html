<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-benchmark-compare" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): `caption` names your series and `badge_text` the reference series; both bar widths are read from the digits the editor typed into the row's value and text, on one shared scale.
</f:comment>

<section class="astryx-section g-data-benchmark-compare" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
