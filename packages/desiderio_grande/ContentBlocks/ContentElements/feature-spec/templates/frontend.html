<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-feature-spec" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Renders as a real description list so the pairs survive copy-paste into a document; 'text' is the caveat under a pair.
</f:comment>

<section class="astryx-section g-feature-spec" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
