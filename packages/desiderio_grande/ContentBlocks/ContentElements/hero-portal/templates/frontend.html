<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-portal" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Whole cards are the link target, so the title is not a nested anchor; the child description is one line, not a paragraph.
</f:comment>

<section class="astryx-section g-hero-portal" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
