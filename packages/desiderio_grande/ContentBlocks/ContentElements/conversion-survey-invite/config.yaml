name: desiderio-grande/conversion-survey-invite
typeName: desiderio_grande_conversionsurveyinvite
title: 'Survey Invite Band'
description: 'Renders the ask to answer a questionnaire: what it is about, how long it takes as a figure with its unit, what happens with the answers, and the button. Use it for: a customer satisfaction survey, research recruitment, a post-project review, a feature poll, a community census. Prefer ''Newsletter Signup Band'' when you want a subscriber rather than an opinion, and ''Referral Invite Band'' when you are asking for a name rather than an answer.'
group: conversion
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'icon'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Icon'
    itemsProcConfig:
      itemsProcFunc: Webconsulting\Desiderio\DataHandling\IconItemsProcessor
  -
    identifier: 'value'
    type: 'Text'
    max: 24
    label: 'Value'
  -
    identifier: 'unit'
    type: 'Text'
    max: 24
    label: 'Unit'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
