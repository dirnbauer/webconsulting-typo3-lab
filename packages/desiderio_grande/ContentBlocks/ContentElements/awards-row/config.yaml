name: desiderio-grande/awards-row
typeName: desiderio_grande_awardsrow
title: 'Awards Row'
description: 'Renders award emblems in a row with the name of the prize and the year beneath each. Use it for: prizes won, rankings and listings, a jury result on an agency profile. Prefer ''Certification Row'' for audited standards and compliance seals, which promise an ongoing state rather than a one-off win, and ''Trust Signals Strip'' for plain service promises with no issuing body behind them.'
group: social-proof
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: awards
    type: Collection
    foreign_table: desiderio_grande_logo_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Awards'
    minitems: 2
    maxitems: 10
