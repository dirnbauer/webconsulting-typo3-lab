<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-timeline" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The child's value carries the year or date label and unit a qualifier such as Q3; the connecting line is drawn with a border, not an element.
</f:comment>

<section class="astryx-section g-timeline" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
