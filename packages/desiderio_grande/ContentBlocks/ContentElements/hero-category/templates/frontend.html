<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-category" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Designed to sit directly above a list plugin, so its bottom spacing is deliberately smaller than every other hero.
</f:comment>

<section class="astryx-section g-hero-category" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
