name: desiderio-grande/culture-band
typeName: desiderio_grande_cultureband
title: 'Culture Band'
description: 'Renders several photographs of the workplace next to a paragraph about how the team works, with one call to action. Use it for: the how-we-work section of a careers page, an office move announcement, a studio showing its craft rather than its people. Prefer ''Team Group Photo'' when a single wide portrait says it better, and ''Open Roles'' when the reader is ready to see the actual vacancies.'
group: team
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'bodytext'
    useExistingField: true
    enableRichtext: true
    richtextConfiguration: 'default'
  -
    identifier: 'images'
    type: 'File'
    maxitems: 12
    allowed: 'common-image-types'
    label: 'Images'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'reverse'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Reverse'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
