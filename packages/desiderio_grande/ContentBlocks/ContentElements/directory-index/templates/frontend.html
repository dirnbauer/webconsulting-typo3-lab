<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-directory-index" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Grouping is derived from the first character of each child's title, so the editor never maintains the letters by hand.
</f:comment>

<section class="astryx-section g-directory-index" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
