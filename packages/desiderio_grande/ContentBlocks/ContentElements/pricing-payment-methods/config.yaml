name: desiderio-grande/pricing-payment-methods
typeName: desiderio_grande_pricingpaymentmethods
title: 'Payment Methods Strip'
description: 'Renders the marks of the payment methods and billing arrangements you accept as a quiet row of logos, with one line of small print for the conditions. Use it for: the foot of a pricing page, the area above a checkout button, a billing help page, an invoice-on-account note for public bodies. Prefer ''Guarantee Band'' when the reassurance is a promise rather than a set of marks, and ''Pricing FAQ'' when each method needs its own explanation.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: methods
    type: Collection
    foreign_table: desiderio_grande_logo_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Payment methods'
    minitems: 1
    maxitems: 12
