name: desiderio-grande/data-distribution-bars
typeName: desiderio_grande_datadistributionbars
title: 'Distribution Bars'
description: 'Renders how one total splits across named buckets, one row per bucket with its share as a bar and its figure at the end. Use it for: a five-star rating breakdown, visitors by channel, orders by region, age groups in a survey. Prefer ''Share Bar'' when the split should read as a single bar, and ''Bar Comparison'' when the rows are independent measures that do not add up to anything.'
group: data
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'value'
    type: 'Textarea'
    rows: 1
    label: 'Value'
  -
    identifier: 'unit'
    type: 'Text'
    max: 24
    label: 'Unit'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: metrics
    type: Collection
    foreign_table: desiderio_grande_metric_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Buckets'
    minitems: 2
    maxitems: 12
