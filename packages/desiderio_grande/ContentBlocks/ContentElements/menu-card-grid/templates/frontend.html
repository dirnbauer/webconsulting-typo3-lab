<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-menu-card-grid" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The whole card is the link target; the icon is decorative and the description line is what makes this worth a card rather than a row.
</f:comment>

<section class="astryx-section g-menu-card-grid" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
