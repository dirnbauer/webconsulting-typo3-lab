<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-conversion-cta-split" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Media keeps its aspect ratio and drops below the copy on narrow screens; 'reverse' swaps the halves without changing the reading order in the markup.
</f:comment>

<section class="astryx-section g-conversion-cta-split" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
