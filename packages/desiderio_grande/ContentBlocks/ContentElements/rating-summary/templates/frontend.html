<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-rating-summary" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Stars are drawn from the value, so a half star renders correctly; the source line is required because an unattributed average is not proof.
</f:comment>

<section class="astryx-section g-rating-summary" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
