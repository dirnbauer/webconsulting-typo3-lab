<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-scorecard" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The scale is five segments, so type 4.5 rather than 90%; the overall score in `value` is typed too and is never averaged from the rows.
</f:comment>

<section class="astryx-section g-data-scorecard" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
