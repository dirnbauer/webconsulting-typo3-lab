name: desiderio-grande/hero-app
typeName: desiderio_grande_heroapp
title: 'App Download Hero'
description: 'Renders a mobile-app opening: copy on one side, a device shot on the other, and a row of store links each carrying its own icon and platform name. Use it for: app landing pages, store campaign pages, the download page a QR code points at, beta programme invitations. Prefer ''Split Media Hero'' when the product is not an app and the links are ordinary buttons, and ''Product Hero'' when the screenshot is a desktop interface rather than a phone.'
group: hero
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'reverse'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Reverse'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: stores
    type: Collection
    foreign_table: desiderio_grande_nav_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Store links'
    minitems: 1
    maxitems: 4
