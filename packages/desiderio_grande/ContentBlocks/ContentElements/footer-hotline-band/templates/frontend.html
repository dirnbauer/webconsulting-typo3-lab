<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-hotline-band" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): `value` holds the number as it should be read, `cta_link` the tel: URL and `text` the staffed hours; a dedicated phone field would suit this better than `value`.
</f:comment>

<section class="astryx-section g-footer-hotline-band" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
