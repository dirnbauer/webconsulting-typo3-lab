<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-key-figures" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): `reverse` puts the figures first; each figure is typed by an editor, so give the reporting period in `note` rather than implying it is current.
</f:comment>

<section class="astryx-section g-data-key-figures" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
