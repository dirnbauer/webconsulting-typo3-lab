name: desiderio-grande/feature-roadmap
typeName: desiderio_grande_featureroadmap
title: 'Shipping Status List'
description: 'Renders capabilities with a state against each one — shipped, in progress, planned — as a dated list rather than a marketing grid. Use it for: public roadmaps, changelog summaries, beta programme pages, migration status during a platform rebuild, funded-project progress reports. Prefer ''Included Checklist'' when the state is only yes or no, and ''Feature Grid'' when everything listed already exists and is being sold rather than tracked.'
group: features
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: items
    type: Collection
    foreign_table: desiderio_grande_label_value
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Roadmap items'
    minitems: 2
    maxitems: 15
