<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-team-list" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Rows stay one line tall at desktop widths; the avatar is decorative here, so a missing portrait leaves no gap in the rhythm.
</f:comment>

<section class="astryx-section g-team-list" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
