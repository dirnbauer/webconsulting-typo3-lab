name: desiderio-grande/footer-payment-row
typeName: desiderio_grande_footerpaymentrow
title: 'Payment and Shipping Row'
description: 'Renders accepted payment methods and delivery partners as a row of marks, each optionally linked to its conditions. Use it for: reassurance under a shop checkout, the foot of a product page, the conditions block of a booking page. Prefer ''Certification Strip'' when the marks are seals the organisation itself holds, and ''Specification Table'' when delivery conditions need to be spelled out in words.'
group: footer
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'text'
    type: 'Textarea'
    rows: 4
    label: 'Text'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: logos
    type: Collection
    foreign_table: desiderio_grande_logo_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Marks'
    minitems: 2
    maxitems: 12
