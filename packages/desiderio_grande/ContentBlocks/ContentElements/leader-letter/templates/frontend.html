<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-leader-letter" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The image slot takes either a signature scan or a small portrait; whichever it is, it renders at the foot of the text, never at the head.
</f:comment>

<section class="astryx-section g-leader-letter" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
