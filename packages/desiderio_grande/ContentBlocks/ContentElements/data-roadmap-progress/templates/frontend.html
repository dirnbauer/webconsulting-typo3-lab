<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-roadmap-progress" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): State comes from the child's icon, progress from the percentage typed in its value; both are editorial statements, so date the band in `note`.
</f:comment>

<section class="astryx-section g-data-roadmap-progress" data-variant="{data.variant}">

        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
