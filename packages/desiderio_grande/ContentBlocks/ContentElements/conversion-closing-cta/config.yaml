name: desiderio-grande/conversion-closing-cta
typeName: desiderio_grande_conversionclosingcta
title: 'Closing CTA Band'
description: 'Renders the band that ends a page: a heading repeating the offer in the reader''s own words, one or two sentences, a primary button and a quieter second link for people who are not ready yet. Use it for: the foot of a landing page, the end of a long article, the last screen of a product tour, the close of a case study. Prefer ''Split CTA with Media'' when a picture carries part of the argument, and ''Inline CTA Strip'' for something slim enough to sit mid-article.'
group: conversion
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Text'
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
