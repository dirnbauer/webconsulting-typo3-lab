<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-pros-cons" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The child's included toggle decides the column: on lands in the column for, off in the column against; value may hold a weighting such as 'major'.
</f:comment>

<section class="astryx-section g-pros-cons" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
