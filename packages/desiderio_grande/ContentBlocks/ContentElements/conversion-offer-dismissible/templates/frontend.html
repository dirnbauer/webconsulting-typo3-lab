<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-conversion-offer-dismissible" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The only scripted element in the group: data-g-dismiss hides the bar and remembers it locally. Never re-open it on the next page load, and keep the close control at least as tappable as the button.
</f:comment>

<section class="astryx-section g-conversion-offer-dismissible" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
