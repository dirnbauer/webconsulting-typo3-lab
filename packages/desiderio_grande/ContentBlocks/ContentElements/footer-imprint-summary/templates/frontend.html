<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-imprint-summary" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): A summary, not a substitute: keep the full imprint page and point `cta_link` at it, since which details are required depends on the operator.
</f:comment>

<section class="astryx-section g-footer-imprint-summary" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
