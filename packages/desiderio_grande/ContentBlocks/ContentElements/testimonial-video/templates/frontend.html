<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-testimonial-video" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): No player is embedded: the poster is a link, which keeps the band free of third-party scripts and consent prompts until the reader chooses to watch.
</f:comment>

<section class="astryx-section g-testimonial-video" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
