name: desiderio-grande/review-list
typeName: desiderio_grande_reviewlist
title: 'Review List'
description: 'Renders individual reviews as stacked rows, each with its star rating, the reviewer, and the text as submitted. Use it for: product reviews under a shop listing, verified feedback on a service page, the detail below an aggregate score. Prefer ''Rating Summary'' when only the average is needed, and ''Testimonial Grid'' when the quotes were solicited and edited rather than left by customers themselves.'
group: social-proof
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: reviews
    type: Collection
    foreign_table: desiderio_grande_quote_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Reviews'
    minitems: 2
    maxitems: 20
