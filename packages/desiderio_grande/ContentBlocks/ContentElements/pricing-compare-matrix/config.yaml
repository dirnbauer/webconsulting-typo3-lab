name: desiderio-grande/pricing-compare-matrix
typeName: desiderio_grande_pricingcomparematrix
title: 'Feature Comparison Matrix'
description: 'Renders a table of feature rows: the feature name, what this plan actually gives, a footnote for the caveat, and a tick or a dash. The ''plan-column'' variant renders one narrow column meant to stand beside its siblings; ''full-table'' fills the band alone. Use it for: the long comparison under a tier row, a single plan''s full specification, an at-a-glance yes-and-no list. Prefer ''What''s Included Checklist'' for a short list with no comparison to make, and ''Total Cost Comparison'' when the difference is money rather than features.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'variant'
    type: 'Select'
    renderType: 'selectSingle'
    prefixField: true
    label: 'Variant'
    items:
      -
        label: 'Full table'
        value: 'full-table'
      -
        label: 'Plan column'
        value: 'plan-column'
    default: 'full-table'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: rows
    type: Collection
    foreign_table: desiderio_grande_label_value
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Comparison rows'
    minitems: 3
    maxitems: 60
