name: desiderio-grande/hero-profile
typeName: desiderio_grande_heroprofile
title: 'Profile Hero'
description: 'Renders a person-led opening: portrait, name, role, two or three sentences of introduction, and a row of contact or profile links each with its own icon. Use it for: portfolio and freelance sites, speaker pages, author pages, consultant and coach landings, candidate and campaign pages. Prefer ''Testimonial Hero'' when the person is quoted rather than introduced, and ''Article Hero'' when the portrait is a byline on a piece of writing.'
group: hero
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'role'
    type: 'Textarea'
    rows: 1
    label: 'Role'
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Text'
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'reverse'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Reverse'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: links
    type: Collection
    foreign_table: desiderio_grande_nav_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Profile links'
    maxitems: 6
