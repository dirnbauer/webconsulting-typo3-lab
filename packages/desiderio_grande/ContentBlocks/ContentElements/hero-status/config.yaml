name: desiderio-grande/hero-status
typeName: desiderio_grande_herostatus
title: 'Status Hero'
description: 'Renders a service-state opening: a coloured state dot with its sentence, the headline, one measured value such as uptime or response time, and a link to the full history. Use it for: status and trust pages, uptime dashboards, incident communication, planned maintenance windows, service-level reporting. Prefer ''Announcement Hero'' when the message is news rather than a live state, and ''Hero with Metrics'' when several numbers matter equally.'
group: hero
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'value'
    type: 'Text'
    max: 24
    label: 'Value'
  -
    identifier: 'unit'
    type: 'Text'
    max: 24
    label: 'Unit'
  -
    identifier: 'badge_text'
    type: 'Textarea'
    rows: 1
    label: 'Badge text'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
