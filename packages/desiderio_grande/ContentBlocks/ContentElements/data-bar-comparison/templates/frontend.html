<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-bar-comparison" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): No chart library ships with this theme: each bar is a grid cell whose width is the percentage typed on the row, so scale the values yourself before entering them.
</f:comment>

<section class="astryx-section g-data-bar-comparison" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
