<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-team-grid" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Portraits are cropped to one ratio for the whole grid; mixed ratios are the fastest way to make a good team look untidy.
</f:comment>

<section class="astryx-section g-team-grid" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
