<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-resource-links" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): External targets get rel=noopener and a visible out-of-site marker; the child's description doubles as the name of the source.
</f:comment>

<section class="astryx-section g-resource-links" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
