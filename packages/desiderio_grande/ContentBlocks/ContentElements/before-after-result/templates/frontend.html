<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-before-after-result" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The child text field holds the starting value; the delta variant computes nothing, it only styles the arrow, so the editor stays in control of the claim.
</f:comment>

<section class="astryx-section g-before-after-result" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
