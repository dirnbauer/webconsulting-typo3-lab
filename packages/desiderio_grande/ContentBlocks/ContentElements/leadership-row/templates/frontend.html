<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-leadership-row" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Beyond six people the row stops reading as leadership and starts reading as a small team grid; the max enforces that.
</f:comment>

<section class="astryx-section g-leadership-row" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
