<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-code" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): text holds the snippet verbatim and is never rich text; copy-to-clipboard comes from the shared code atom, not from this element.
</f:comment>

<section class="astryx-section g-hero-code" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
