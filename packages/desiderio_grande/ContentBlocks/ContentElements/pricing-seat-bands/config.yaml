name: desiderio-grande/pricing-seat-bands
typeName: desiderio_grande_pricingseatbands
title: 'Seat Price Bands'
description: 'Renders a volume ladder: each row a seat range, the price per seat inside that range, and a note. The entry price and its period sit above the ladder so a reader sees where it starts before they see where it falls. Use it for: per-user SaaS pricing, licence packs that get cheaper in bulk, team plans with a minimum seat count, classroom licences. Prefer ''Licence Tiers'' for named editions rather than quantities, and ''Usage Rate Table'' when what is counted is consumption rather than people.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'price'
    type: 'Textarea'
    rows: 1
    label: 'Price'
  -
    identifier: 'period'
    type: 'Textarea'
    rows: 1
    label: 'Period'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: bands
    type: Collection
    foreign_table: desiderio_grande_label_value
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Seat bands'
    minitems: 2
    maxitems: 12
