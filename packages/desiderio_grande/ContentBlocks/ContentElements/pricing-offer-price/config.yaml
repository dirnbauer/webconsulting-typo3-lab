name: desiderio-grande/pricing-offer-price
typeName: desiderio_grande_pricingofferprice
title: 'Launch Offer Price'
description: 'Renders a price that has been reduced: the former figure struck through, the current one large beside it, a badge for the reason and a written deadline in the small print. Use it for: a launch discount, a seasonal band, an early-bird conference rate, a clearance offer, a renewal incentive. Prefer ''Single Price Panel'' once the offer becomes the normal price, and ''Discount & Eligibility Note'' for a standing reduction that only some readers qualify for.'
group: pricing
