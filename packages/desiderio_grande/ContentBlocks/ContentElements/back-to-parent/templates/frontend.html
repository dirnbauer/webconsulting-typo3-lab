<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-back-to-parent" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Falls back to the parent page from the rootline when cta_link is left empty, so the element still works on a page that gets moved.
</f:comment>

<section class="astryx-section g-back-to-parent" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
