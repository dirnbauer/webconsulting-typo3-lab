<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-sitemap" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The list is maintained by hand, not generated from the page tree: an entry with an empty link becomes a section heading, everything under it a page link.
</f:comment>

<section class="astryx-section g-footer-sitemap" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
