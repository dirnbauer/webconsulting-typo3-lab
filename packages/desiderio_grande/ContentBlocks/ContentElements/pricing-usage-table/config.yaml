name: desiderio-grande/pricing-usage-table
typeName: desiderio_grande_pricingusagetable
title: 'Usage Rate Table'
description: 'Renders a metered rate card: one row per billable unit, the price for that unit beside it, and a note on how the unit is counted. Nothing is added up — the table states rates and leaves the arithmetic to the invoice. Use it for: pay-as-you-go API pricing, per-gigabyte storage, per-transaction fees, printing, delivery or courier rates. Prefer ''Seat Price Bands'' when the rate falls with volume, and ''Cost Calculator Sheet'' when the reader is meant to work out a total.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: rates
    type: Collection
    foreign_table: desiderio_grande_label_value
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Rate rows'
    minitems: 1
    maxitems: 40
