<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-speaker-featured" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The heading is the session title, not the speaker's name; the name lives in author so a programme page reads as a list of talks.
</f:comment>

<section class="astryx-section g-speaker-featured" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
