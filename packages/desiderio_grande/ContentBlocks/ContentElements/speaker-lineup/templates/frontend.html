<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-speaker-lineup" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The child text field carries the talk title and the link points at the session, so the lineup doubles as a programme index.
</f:comment>

<section class="astryx-section g-speaker-lineup" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
