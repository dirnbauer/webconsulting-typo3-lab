name: desiderio-grande/feature-steps
typeName: desiderio_grande_featuresteps
title: 'How It Works'
description: 'Renders a numbered sequence — each step a figure, a title, a sentence and an optional link — laid out along a connector so the order reads at a glance. Use it for: onboarding explanations, order and delivery processes, application and enrolment paths, service journeys, recipe-style instructions. Prefer ''Workflow Stages'' when the boxes are system states rather than things the reader does, and ''Feature Grid'' when the entries have no order between them at all.'
group: features
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'columns'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Columns'
    items:
      -
        label: 'Two'
        value: '2'
      -
        label: 'Three'
        value: '3'
      -
        label: 'Four'
        value: '4'
    default: '2'
  -
    identifier: 'variant'
    type: 'Select'
    renderType: 'selectSingle'
    prefixField: true
    label: 'Variant'
    items:
      -
        label: 'Horizontal'
        value: 'horizontal'
      -
        label: 'Vertical'
        value: 'vertical'
    default: 'horizontal'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: steps
    type: Collection
    foreign_table: desiderio_grande_icon_lead
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Steps'
    minitems: 2
    maxitems: 6
