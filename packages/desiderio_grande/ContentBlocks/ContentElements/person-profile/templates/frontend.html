<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-person-profile" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The name goes in header and the role in subheader, so the page module and search show a real person rather than an untitled element.
</f:comment>

<section class="astryx-section g-person-profile" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
