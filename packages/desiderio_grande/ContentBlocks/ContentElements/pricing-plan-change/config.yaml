name: desiderio-grande/pricing-plan-change
typeName: desiderio_grande_pricingplanchange
title: 'Plan Change Explainer'
description: 'Renders the rules of moving between plans as questions and answers: upgrading mid-term, downgrading, what happens to data on cancellation, when a refund is due, how notice periods work. Use it for: the band under a tier row, a billing help page, the section a support team links to twice a day. Prefer ''Pricing FAQ'' for the wider set of money questions, and ''Guarantee Band'' when the promise is one sentence worth saying loudly.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: rules
    type: Collection
    foreign_table: desiderio_grande_qa_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Questions'
    minitems: 1
    maxitems: 12
