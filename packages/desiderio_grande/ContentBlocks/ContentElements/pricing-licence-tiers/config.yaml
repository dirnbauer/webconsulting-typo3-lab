name: desiderio-grande/pricing-licence-tiers
typeName: desiderio_grande_pricinglicencetiers
title: 'Licence Tiers'
description: 'Renders named licence editions as a list: the edition, what it costs, and the scope it covers — one site, five sites, an agency, redistribution. Use it for: perpetual software licences, font and asset licences, template and theme editions, image rights, OEM terms. Prefer ''Plan Card'' for recurring subscriptions that each deserve a card of their own, and ''Seat Price Bands'' when the ladder is a quantity rather than a named edition.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
