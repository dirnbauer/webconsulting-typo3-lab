name: desiderio-grande/quote-carousel
typeName: desiderio_grande_quotecarousel
title: 'Quote Carousel'
description: 'Renders several quotations in a track that shows one at a time, with dots and arrows to move between them and a swipe on touch. Use it for: a run of customer verdicts, reviews after a conference, alumni voices on a course page, statements from every partner in a consortium. Prefer ''Quote with Portrait'' when one voice is enough for the page, and ''Pull Quote'' for a line taken from the article itself.'
group: content
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: quotes
    type: Collection
    foreign_table: desiderio_grande_quote_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Quotes'
    minitems: 2
    maxitems: 12
