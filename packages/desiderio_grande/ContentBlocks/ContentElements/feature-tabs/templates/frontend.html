<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-feature-tabs" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): data-g-tabs; every panel is in the markup and the first is open, so the content is indexed, printable and works without the script.
</f:comment>

<section class="astryx-section g-feature-tabs" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
