<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-opening-hours" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Nothing here knows the time: no day is marked as today and no 'open now' state is shown — it is the published schedule, and exceptions go in `note`.
</f:comment>

<section class="astryx-section g-footer-opening-hours" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
