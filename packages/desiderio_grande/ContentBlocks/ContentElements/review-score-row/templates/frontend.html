<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-review-score-row" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The unit holds the scale, so a 4.7 out of 5 and a 92 out of 100 can sit in the same row without either looking wrong.
</f:comment>

<section class="astryx-section g-review-score-row" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
