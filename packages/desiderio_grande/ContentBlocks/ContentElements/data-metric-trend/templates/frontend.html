<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-metric-trend" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The direction comes from the variant and the delta from `badge_text` — both are editorial decisions, nothing is derived from the figure.
</f:comment>

<section class="astryx-section g-data-metric-trend" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
