<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-table-caption" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Every value is typed into the row; the caption becomes the table's caption element and `note` the source line beneath it.
</f:comment>

<section class="astryx-section g-data-table-caption" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
