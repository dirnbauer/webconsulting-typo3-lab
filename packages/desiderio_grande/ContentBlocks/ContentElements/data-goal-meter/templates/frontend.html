<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-goal-meter" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The meter fill is the percentage typed in `value`; the absolute figures live in `text` so the editor decides how they are written.
</f:comment>

<section class="astryx-section g-data-goal-meter" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
