name: desiderio-grande/footer-legal-links
typeName: desiderio_grande_footerlegallinks
title: 'Legal Links Bar'
description: 'Renders imprint, privacy, terms and accessibility links as a single line separated by rules, wrapping on narrow screens. Use it for: the legal line at the end of a landing page that has no template footer, a microsite, a campaign page in its own layout. Prefer ''Copyright Bar'' when a copyright line is the whole content, and ''Imprint Summary'' when the operator details themselves must be shown.'
group: footer
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'text'
    type: 'Textarea'
    rows: 4
    label: 'Text'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: links
    type: Collection
    foreign_table: desiderio_grande_nav_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Links'
    minitems: 2
    maxitems: 10
