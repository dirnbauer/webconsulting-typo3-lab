<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-copyright-bar" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The year is typed by the editor like everything else — nothing here reads the clock, so review it when the year turns.
</f:comment>

<section class="astryx-section g-footer-copyright-bar" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
