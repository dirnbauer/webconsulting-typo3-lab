<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-menu-featured" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The featured half lives in the block's own fields, the rest in the collection — that is what keeps one entry visibly senior to the others.
</f:comment>

<section class="astryx-section g-menu-featured" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
