name: desiderio-grande/pricing-single-price
typeName: desiderio_grande_pricingsingleprice
title: 'Single Price Panel'
description: 'Renders one price and one action, with a short list of what is included underneath. There are no tiers to compare and no columns to align — the band exists to state a number and take the click. Use it for: a one-product shop page, a course fee, a flat-rate service, a single licence, a deposit. Prefer ''Plan Card'' as soon as a second price exists, and ''Launch Offer Price'' when a former price has to be crossed out beside the current one.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'price'
    type: 'Textarea'
    rows: 1
    label: 'Price'
  -
    identifier: 'period'
    type: 'Textarea'
    rows: 1
    label: 'Period'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Textarea'
    rows: 1
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: included
    type: Collection
    foreign_table: desiderio_grande_label_value
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Included'
    maxitems: 10
