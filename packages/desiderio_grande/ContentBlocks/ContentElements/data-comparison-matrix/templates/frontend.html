<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-comparison-matrix" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Two subjects only: the tick column is each row's `included` toggle, the second column its text; name both sides in `caption` so the columns stay readable on mobile.
</f:comment>

<section class="astryx-section g-data-comparison-matrix" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
