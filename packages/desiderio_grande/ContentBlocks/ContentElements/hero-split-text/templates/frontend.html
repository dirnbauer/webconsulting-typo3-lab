<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-split-text" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The only hero that takes rich text, because the right column is genuinely prose; it collapses to one column below the medium breakpoint.
</f:comment>

<section class="astryx-section g-hero-split-text" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
