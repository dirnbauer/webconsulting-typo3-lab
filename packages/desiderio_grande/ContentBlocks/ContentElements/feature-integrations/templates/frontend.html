<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-feature-integrations" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Marks render at one optical height; a child without a link renders as a plain tile rather than a dead anchor.
</f:comment>

<section class="astryx-section g-feature-integrations" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
