<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-back-to-top" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): A plain anchor to the page top: no scroll listener, no appearing-on-scroll behaviour, and `cta_link` only if the band should jump somewhere other than the top.
</f:comment>

<section class="astryx-section g-footer-back-to-top" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
