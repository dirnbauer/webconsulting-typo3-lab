name: desiderio-grande/feature-index
typeName: desiderio_grande_featureindex
title: 'Full Feature Index'
description: 'Renders every capability as a dense multi-column index of linked one-liners, in the order an editor gives them — the reference list rather than the sales band. Use it for: ''all features'' pages, module catalogues, comparison footers, sitemap-like overviews, the page a search engine should find every term on. Prefer ''Feature Grid'' when a dozen entries need selling rather than listing, and ''Included Checklist'' when readers care whether each line is part of their plan.'
group: features
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'columns'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Columns'
    items:
      -
        label: 'Two'
        value: '2'
      -
        label: 'Three'
        value: '3'
      -
        label: 'Four'
        value: '4'
    default: '2'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: entries
    type: Collection
    foreign_table: desiderio_grande_nav_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Index entries'
    minitems: 5
    maxitems: 60
