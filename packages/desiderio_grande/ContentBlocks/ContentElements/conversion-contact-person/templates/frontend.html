<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-conversion-contact-person" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Use a real photograph of a real colleague and keep it current; a stock portrait beside a direct line is the fastest way to lose the trust the panel is for.
</f:comment>

<section class="astryx-section g-conversion-contact-person" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
