name: desiderio-grande/hero-logos
typeName: desiderio_grande_herologos
title: 'Hero with Logo Strip'
description: 'Renders the opening band and closes it with a quiet row of customer or partner marks and one line introducing them. Use it for: B2B home pages, enterprise landing pages, agency portfolios, any first screen that has to answer ''who else uses this'' before the reader scrolls. Prefer ''Hero with Metrics'' when the proof is a number rather than a name, and ''Testimonial Hero'' when one named customer says it better than ten marks.'
group: hero
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: logos
    type: Collection
    foreign_table: desiderio_grande_logo_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Logos'
    minitems: 3
    maxitems: 10
