<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-allocation-breakdown" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Consistent with the other bar elements: the percentage in each row's value draws the bar, the amount is typed into its text exactly as it should be printed.
</f:comment>

<section class="astryx-section g-data-allocation-breakdown" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
