<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-language-note" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Plain links, not a switcher: nothing opens or folds out, and the current version is marked with aria-current rather than by removing it from the list.
</f:comment>

<section class="astryx-section g-footer-language-note" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
