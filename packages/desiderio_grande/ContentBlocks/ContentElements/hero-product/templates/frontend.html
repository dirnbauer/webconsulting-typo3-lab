<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-product" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The image keeps its own ratio; the bleed variant lets it run off the bottom edge of the band without cropping the top.
</f:comment>

<section class="astryx-section g-hero-product" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
