name: desiderio-grande/conversion-cta-sticky
typeName: desiderio_grande_conversionctasticky
title: 'Sticky Bottom CTA'
description: 'Renders a slim bar that sticks to the bottom of the viewport while its section is on screen: a short line of text and one button, nothing else. It is CSS position sticky, so it needs no script, never traps a keyboard user and never outlives its own section. Use it for: long sales pages, mobile product pages, a pricing page whose button scrolls out of reach. Prefer ''Dismissible Offer Bar'' when the reader must be able to close it, and ''Inline CTA Strip'' when it should stay where it was put.'
group: conversion
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'text'
    type: 'Textarea'
    rows: 4
    label: 'Text'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Textarea'
    rows: 1
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
