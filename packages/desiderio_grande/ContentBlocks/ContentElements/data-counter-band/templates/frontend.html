<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-counter-band" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): No count-up animation and no source: the figures are typed and appear at once, so keep the labels to one or two words or the band wraps badly.
</f:comment>

<section class="astryx-section g-data-counter-band" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
