<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Preview"/>

<f:section name="Header"></f:section>

<f:section name="Content">
    <f:asset.css identifier="grande-content-preview" href="EXT:desiderio_grande/Resources/Public/Css/content-preview.css"/>
    <div class="g-ce-preview" data-slot="card">
        <div class="g-ce-preview__meta">
            <span class="g-ce-preview__ctype">Counter Band</span>
            <span class="g-ce-preview__ctype">uid {data.uid}</span>
        </div>
        <f:if condition="{data.header}">
            <h3 class="g-ce-preview__title">{data.header -> f:format.stripTags() -> f:format.htmlspecialchars()}</h3>
        </f:if>
        <f:if condition="{data.lead}">
            <div class="g-ce-preview__field">
                <span class="g-ce-preview__label">Lead</span>
                <span class="g-ce-preview__value">{data.lead -> f:format.stripTags() -> f:format.htmlspecialchars()}</span>
            </div>
        </f:if>
        <f:if condition="{data.note}">
            <div class="g-ce-preview__field">
                <span class="g-ce-preview__label">Note</span>
                <span class="g-ce-preview__value">{data.note -> f:format.stripTags() -> f:format.htmlspecialchars()}</span>
            </div>
        </f:if>
    </div>
</f:section>

</html>
