name: desiderio-grande/up-next
typeName: desiderio_grande_upnext
title: 'Up Next'
description: 'Renders a single onward pointer as one wide card: a small label, the title of what comes next, a sentence of context and a picture. Use it for: the end of a blog post, the last step of a guide pointing at what to do now, a landing page handing off to the next stage, the close of a case study. Prefer ''Previous and Next'' when the reader may also want to go back, and ''Related Links'' for several suggestions of equal weight.'
group: navigation
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'text'
    type: 'Textarea'
    rows: 4
    label: 'Text'
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
