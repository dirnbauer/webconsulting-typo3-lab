name: desiderio-grande/data-metric-list
typeName: desiderio_grande_datametriclist
title: 'Figures List'
description: 'Renders a compact vertical list with the label on the left and the figure on the right, divided by rules — built for narrow columns. Use it for: quick facts in a sidebar, a summary under a long article, ticket numbers beside an event description, contract terms at a glance. Prefer ''KPI Card Row'' when the figures should carry a full-width band, and ''Specification Table'' when the pairs are product attributes.'
group: data
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: metrics
    type: Collection
    foreign_table: desiderio_grande_metric_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Figures'
    minitems: 2
    maxitems: 14
