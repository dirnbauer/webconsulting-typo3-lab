<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-metric-list" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): No bars and no icons on purpose — this is the element that survives a 300px column; every value is typed by the editor.
</f:comment>

<section class="astryx-section g-data-metric-list" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
