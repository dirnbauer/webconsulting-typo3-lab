<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-big-number" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): `value` and `unit` are typed strings, so '1,2 Mio.' and '€ 1.200.000' are both possible; put the source of the claim in `note`.
</f:comment>

<section class="astryx-section g-data-big-number" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
