<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-big-number" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    A figure with a caption is exactly what a figure element is for: the
    headline is not a section title here, it is the sentence the number
    completes, so it belongs inside the caption rather than above it.
</f:comment>

<section class="astryx-section g-data-big-number {data.tone} {f:if(condition: data.compact, then: 'tight')}">
    <div class="astryx-layout {data.width}">

        <figure class="g-data-big-number__block {data.align}">
            <f:if condition="{data.eyebrow}">
                <p class="astryx-eyebrow">{data -> f:render.text(field: 'eyebrow')}</p>
            </f:if>

            <p class="g-data-big-number__figure">
                <span class="astryx-text display-1 g-data-big-number__value">{data -> f:render.text(field: 'value')}</span><f:if condition="{data.unit}"><span class="g-data-big-number__unit">{data -> f:render.text(field: 'unit')}</span></f:if>
            </p>

            <figcaption class="g-data-big-number__caption">
                <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>

                <f:if condition="{data.lead}">
                    <p class="astryx-text large g-data-big-number__lead">{data -> f:render.text(field: 'lead')}</p>
                </f:if>
            </figcaption>
        </figure>

        <div class="g-data-big-number__after {data.align}">
            <f:if condition="{data.note}">
                <p class="astryx-text supporting g-data-big-number__note">{data -> f:render.text(field: 'note')}</p>
            </f:if>

            <f:if condition="{data.cta_label}">
                <p class="g-data-big-number__actions">
                    <f:link.typolink parameter="{data.cta_link}" class="astryx-button primary lg">{data.cta_label}</f:link.typolink>
                </p>
            </f:if>
        </div>

    </div>
</section>

</html>
