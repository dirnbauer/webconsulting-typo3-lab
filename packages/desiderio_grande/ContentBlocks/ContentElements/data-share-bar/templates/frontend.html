<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-share-bar" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Segment widths are flex ratios taken from the percentages typed on the children — make them add up to a hundred yourself, the bar does not normalise anything.
</f:comment>

<section class="astryx-section g-data-share-bar" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
