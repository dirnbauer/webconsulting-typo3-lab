<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-contents-box" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Entries are curated, not scraped: the child's link takes an anchor such as #part-two, so renaming a heading never silently breaks the list.
</f:comment>

<section class="astryx-section g-contents-box" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
