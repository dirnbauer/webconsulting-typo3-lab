<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-slideshow" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Uses the images field rather than a collection because the copy never changes; rotation halts on hover, on focus and under prefers-reduced-motion.
</f:comment>

<section class="astryx-section g-hero-slideshow" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
