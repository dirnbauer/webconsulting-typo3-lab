<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-section-break" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Outputs an h2 so the outline of a long page stays readable; the rule is decorative and hidden from assistive technology.
</f:comment>

<section class="astryx-section g-section-break" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
