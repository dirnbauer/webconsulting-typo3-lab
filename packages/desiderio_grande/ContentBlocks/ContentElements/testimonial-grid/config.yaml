name: desiderio-grande/testimonial-grid
typeName: desiderio_grande_testimonialgrid
title: 'Testimonial Grid'
description: 'Renders a grid of quote cards, each with its text, a small avatar and the speaker''s role. Use it for: a wall of customer voices on a references page, three short quotes under a pricing table, proof gathered from several industries at once. Prefer ''Quote Carousel'' when there are more quotes than a page can show at once, and ''Review List'' when each entry carries a star rating and a date.'
group: social-proof
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'columns'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Columns'
    items:
      -
        label: 'Two'
        value: '2'
      -
        label: 'Three'
        value: '3'
      -
        label: 'Four'
        value: '4'
    default: '2'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: quotes
    type: Collection
    foreign_table: desiderio_grande_quote_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Testimonials'
    minitems: 2
    maxitems: 12
