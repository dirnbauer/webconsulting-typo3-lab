<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-feature-rail" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): CSS scroll-snap and overflow only, no script; the row is a focusable region so it can be scrolled from the keyboard.
</f:comment>

<section class="astryx-section g-feature-rail" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
