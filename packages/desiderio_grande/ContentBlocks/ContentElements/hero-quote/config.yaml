name: desiderio-grande/hero-quote
typeName: desiderio_grande_heroquote
title: 'Testimonial Hero'
description: 'Renders an opening band built around one customer sentence: the quotation set large, the person, their role and portrait, and the product action beside it. Use it for: case-study landings, reference pages, campaign pages aimed at a sceptical reader, post-sale onboarding pages. Prefer ''Hero with Logo Strip'' when the proof is a set of names rather than one voice, and ''Statement Hero'' when the sentence is yours rather than a customer''s.'
group: hero
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'quote_text'
    type: 'Textarea'
    rows: 4
    label: 'Quote text'
  -
    identifier: 'author'
    type: 'Textarea'
    rows: 1
    label: 'Author'
  -
    identifier: 'role'
    type: 'Textarea'
    rows: 1
    label: 'Role'
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
