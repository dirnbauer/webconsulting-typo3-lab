<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-percent-ring" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The ring angle is read from the digits in `value`, so type '72%' rather than 'roughly three quarters'; a conic-gradient does the drawing, no script and no SVG.
</f:comment>

<section class="astryx-section g-data-percent-ring" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
