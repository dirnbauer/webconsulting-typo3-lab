<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-founder-story" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The prose column caps at 65ch even in the wide variant; a founder story that runs the full page width does not get read.
</f:comment>

<section class="astryx-section g-founder-story" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
