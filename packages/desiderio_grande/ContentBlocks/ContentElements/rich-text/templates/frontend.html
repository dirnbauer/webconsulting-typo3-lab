<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-rich-text" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    The editor's own markup is handed to .astryx-prose rather than styled here:
    a paragraph inside a rich text block has to read the same on every page,
    and one shared rule is the only way that stays true across the catalog.
</f:comment>

<section class="astryx-section g-rich-text {data.tone}">
    <div class="astryx-layout {data.width}">
        <div class="g-rich-text__body align-{data.align}">

            <f:if condition="{data.header}">
                <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
            </f:if>

            <div class="astryx-prose"><f:format.html>{data.bodytext}</f:format.html></div>

        </div>
    </div>
</section>

</html>
