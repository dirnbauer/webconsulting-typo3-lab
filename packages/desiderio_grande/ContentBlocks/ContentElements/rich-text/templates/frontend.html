<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-rich-text" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Measure caps around 68ch; headings inside the editor start at h3 so the page keeps exactly one h1.
</f:comment>

<section class="astryx-section g-rich-text" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
