<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-prev-next" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): cta_* is the next page and gets the emphasis, secondary_* is the previous one; either half may be empty at the ends of a series and the other then spans the band.
</f:comment>

<section class="astryx-section g-prev-next" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
