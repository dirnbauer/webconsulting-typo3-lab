name: desiderio-grande/conversion-callback
typeName: desiderio_grande_conversioncallback
title: 'Callback Request Band'
description: 'Renders the offer to ring the reader back: when the line is staffed, how quickly a call comes, which number will show on their phone, and the button that opens the request. Use it for: high-value services, insurance and finance pages, an out-of-hours support page, a page whose visitors do not write emails. Prefer ''Contact Form Band'' when a written answer is expected, and ''Demo Booking Band'' when the call is a scheduled appointment with an agenda.'
group: conversion
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'icon'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Icon'
    itemsProcConfig:
      itemsProcFunc: Webconsulting\Desiderio\DataHandling\IconItemsProcessor
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Textarea'
    rows: 1
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
