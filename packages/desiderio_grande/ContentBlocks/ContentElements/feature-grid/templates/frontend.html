<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-feature-grid" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The plain variant drops the card surface entirely; cells keep equal height so icons stay on one optical line.
</f:comment>

<section class="astryx-section g-feature-grid" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
