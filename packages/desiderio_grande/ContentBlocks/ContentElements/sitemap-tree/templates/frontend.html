<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-sitemap-tree" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Built from the page tree under the current page rather than a curated list, so it can never fall out of date; hidden and no-search pages are skipped.
</f:comment>

<section class="astryx-section g-sitemap-tree" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
