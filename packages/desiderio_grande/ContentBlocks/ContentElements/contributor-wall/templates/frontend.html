<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-contributor-wall" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Only image and title are rendered; roles and biographies are ignored here on purpose, because the point of a wall is the number of faces.
</f:comment>

<section class="astryx-section g-contributor-wall" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
