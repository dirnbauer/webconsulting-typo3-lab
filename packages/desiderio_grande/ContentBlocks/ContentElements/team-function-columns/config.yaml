name: desiderio-grande/team-function-columns
typeName: desiderio_grande_teamfunctioncolumns
title: 'Team by Function'
description: 'Renders one grid whose people are grouped into columns headed by their function, names listed under each heading without portraits. Use it for: a large agency showing its disciplines, a production credits panel, an institute listing who does what. Prefer ''Departments'' when each group needs its own band, description and tone, and ''Team Directory'' when a single flat list of rows is easier to search.'
group: team
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'columns'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Columns'
    items:
      -
        label: 'Two'
        value: '2'
      -
        label: 'Three'
        value: '3'
      -
        label: 'Four'
        value: '4'
    default: '2'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: people
    type: Collection
    foreign_table: desiderio_grande_person_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'People'
    minitems: 3
    maxitems: 80
