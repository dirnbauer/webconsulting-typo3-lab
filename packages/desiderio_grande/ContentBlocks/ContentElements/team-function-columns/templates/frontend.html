<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-team-function-columns" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The template groups by the child role field and orders the columns by first appearance, so editors control the order by sorting the records.
</f:comment>

<section class="astryx-section g-team-function-columns" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
