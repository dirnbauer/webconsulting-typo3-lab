<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-contact-person" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): One person only; when the page needs a whole team, that belongs in a team element rather than several copies of this one.
</f:comment>

<section class="astryx-section g-footer-contact-person" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
