<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-testimonial-carousel" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Scroll snapping and the track itself are CSS; the behaviour only adds the arrow buttons and the live region announcing the current slide.
</f:comment>

<section class="astryx-section g-testimonial-carousel" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
