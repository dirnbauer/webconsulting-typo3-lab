name: desiderio-grande/steps-howto
typeName: desiderio_grande_stepshowto
title: 'Numbered Steps'
description: 'Renders instructions as a numbered sequence, each step with an icon, a heading and a sentence or two of what to do. Use it for: a how-to in a help centre, an application procedure, an onboarding checklist, assembly instructions, the stages of a service. Prefer ''Timeline'' when the sequence is history rather than instruction, and ''Step Navigation'' when each step is a page of its own that the reader has to travel to.'
group: content
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'columns'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Columns'
    items:
      -
        label: 'Two'
        value: '2'
      -
        label: 'Three'
        value: '3'
      -
        label: 'Four'
        value: '4'
    default: '2'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: steps
    type: Collection
    foreign_table: desiderio_grande_icon_lead
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Steps'
    minitems: 2
    maxitems: 12
