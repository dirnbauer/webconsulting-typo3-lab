<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-partner-grid" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): A partner card carries a mark, a name and one link and nothing else; if a partner needs a paragraph, that paragraph belongs on the linked page.
</f:comment>

<section class="astryx-section g-partner-grid" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
