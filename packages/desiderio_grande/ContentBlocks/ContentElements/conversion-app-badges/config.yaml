name: desiderio-grande/conversion-app-badges
typeName: desiderio_grande_conversionappbadges
title: 'App Store Buttons Band'
description: 'Renders the store marks for a mobile app beside a device shot: one badge per store, each linked, with the platform requirements in the small print. Use it for: an app landing page, a product page with a companion app, a campaign page pointing at a download, a support page telling people where to update. Prefer ''Split CTA with Media'' for a web product whose action is a button rather than a store badge, and ''Lead Magnet Download'' when the file is a document.'
group: conversion
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'reverse'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Reverse'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: stores
    type: Collection
    foreign_table: desiderio_grande_logo_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Stores'
    minitems: 1
    maxitems: 4
