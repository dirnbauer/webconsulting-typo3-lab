<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-conversion-app-badges" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Store badges are supplied artwork with mandatory clear space and fixed wording; keep them as images in the collection instead of redrawing them as buttons.
</f:comment>

<section class="astryx-section g-conversion-app-badges" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
