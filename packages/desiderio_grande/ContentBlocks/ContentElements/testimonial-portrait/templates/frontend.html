<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-testimonial-portrait" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The portrait keeps its aspect ratio and never crops below the eyes; the quote column caps at 45ch so it stays readable next to a tall image.
</f:comment>

<section class="astryx-section g-testimonial-portrait" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
