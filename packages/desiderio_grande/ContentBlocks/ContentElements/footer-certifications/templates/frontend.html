<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-certifications" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Seal, name and a link to the certificate; validity dates and certificate numbers go in `note` so an expired seal is easy to spot and remove.
</f:comment>

<section class="astryx-section g-footer-certifications" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
