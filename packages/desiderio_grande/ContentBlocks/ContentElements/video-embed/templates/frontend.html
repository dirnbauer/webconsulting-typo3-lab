<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-video-embed" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): cta_link takes the video URL (external or a FAL file); the frame is a plain iframe inside AspectRatio, so nothing has to run first.
</f:comment>

<section class="astryx-section g-video-embed" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
