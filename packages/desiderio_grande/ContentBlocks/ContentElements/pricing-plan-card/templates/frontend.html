<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-pricing-plan-card" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Sibling cards match height through the grid row, not through padding; 'featured' lifts one card without widening it.
</f:comment>

<section class="astryx-section g-pricing-plan-card" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
