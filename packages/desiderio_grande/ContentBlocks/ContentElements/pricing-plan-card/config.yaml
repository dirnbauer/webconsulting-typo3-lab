name: desiderio-grande/pricing-plan-card
typeName: desiderio_grande_pricingplancard
title: 'Plan Card'
description: 'Renders one subscription plan as a card: name, price, billing period, a sentence of positioning, a ticked feature list and its own button. Place two, three or four side by side — each plan is a separate element, so a tier can be reordered, hidden or translated without touching its neighbours. Use it for: a three-tier SaaS page, a free-and-paid split, a row of agency retainers. Prefer ''Featured Plan Spotlight'' for the one tier that should be read first, and ''Single Price Panel'' when there is nothing to compare.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'badge_text'
    type: 'Textarea'
    rows: 1
    label: 'Badge text'
  -
    identifier: 'price'
    type: 'Textarea'
    rows: 1
    label: 'Price'
  -
    identifier: 'period'
    type: 'Textarea'
    rows: 1
    label: 'Period'
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Textarea'
    rows: 1
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'featured'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Featured'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: features
    type: Collection
    foreign_table: desiderio_grande_label_value
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Plan features'
    minitems: 1
    maxitems: 14
