<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-quick-links" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Labels are truncated hard at one line; the icon is required here because the bar is read at a glance, not word by word.
</f:comment>

<section class="astryx-section g-quick-links" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
