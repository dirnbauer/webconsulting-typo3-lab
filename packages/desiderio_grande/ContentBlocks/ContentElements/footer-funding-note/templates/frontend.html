<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-funding-note" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Funding programmes prescribe both wording and logo clear space, so keep the sentence in `text` editable and never crop the supplied logo.
</f:comment>

<section class="astryx-section g-footer-funding-note" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
