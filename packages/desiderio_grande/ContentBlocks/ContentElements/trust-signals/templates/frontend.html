<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-trust-signals" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Each promise is one line at most; the strip has no heading on purpose, so it can be dropped between any two bands without breaking the outline.
</f:comment>

<section class="astryx-section g-trust-signals" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
