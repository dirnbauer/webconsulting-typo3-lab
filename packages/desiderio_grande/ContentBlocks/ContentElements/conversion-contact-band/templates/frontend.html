<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-conversion-contact-band" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Only promise a response time you can hold; the band is the visible half of a promise the form framework has to keep.
</f:comment>

<section class="astryx-section g-conversion-contact-band" data-variant="{data.variant}">

        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
