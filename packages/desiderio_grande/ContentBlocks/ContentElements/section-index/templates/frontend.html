<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-section-index" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Entries flow down each column before moving to the next, so alphabetical order still reads correctly at every breakpoint.
</f:comment>

<section class="astryx-section g-section-index" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
