name: desiderio-grande/feature-before-after
typeName: desiderio_grande_featurebeforeafter
title: 'Before and After Images'
description: 'Renders two states of the same subject under one heading — side by side, or wiped over each other on hover and focus — each with its own caption and a sentence explaining what changed. Use it for: renovation and restoration work, design refreshes, migration and cleanup results, treatment and training outcomes, photo retouching. Prefer ''Feature Showcase Row'' when there is only one image, and ''Us vs the Status Quo'' when the comparison is a list of points rather than a picture.'
group: features
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'images'
    type: 'File'
    maxitems: 12
    allowed: 'common-image-types'
    label: 'Images'
  -
    identifier: 'caption'
    type: 'Textarea'
    rows: 1
    label: 'Caption'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'variant'
    type: 'Select'
    renderType: 'selectSingle'
    prefixField: true
    label: 'Variant'
    items:
      -
        label: 'Side by side'
        value: 'side-by-side'
      -
        label: 'Overlay reveal'
        value: 'overlay-reveal'
    default: 'side-by-side'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
