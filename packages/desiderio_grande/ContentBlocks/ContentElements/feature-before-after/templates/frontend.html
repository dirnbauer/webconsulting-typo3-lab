<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-feature-before-after" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Takes the first two files from images; overlay-reveal is a CSS hover and focus wipe, so it degrades to two stacked pictures.
</f:comment>

<section class="astryx-section g-feature-before-after" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
