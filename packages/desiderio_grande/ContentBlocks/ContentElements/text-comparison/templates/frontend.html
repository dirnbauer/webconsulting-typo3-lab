<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-text-comparison" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): header labels the left column and subheader the right; reverse swaps both the headings and their texts so the emphasis can move.
</f:comment>

<section class="astryx-section g-text-comparison" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
