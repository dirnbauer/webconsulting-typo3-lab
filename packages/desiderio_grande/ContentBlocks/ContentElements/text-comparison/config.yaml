name: desiderio-grande/text-comparison
typeName: desiderio_grande_textcomparison
title: 'Side-by-Side Texts'
description: 'Renders two passages of prose in facing columns under their own headings, so a reader can compare them line for line. Use it for: before and after wording, the old rule against the new one, two translations of the same paragraph, a claim next to its correction, two positions in a debate. Prefer ''Pros and Cons'' when each side is a list of points, and ''Text with Media'' when one of the two sides is a picture.'
group: content
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'bodytext'
    useExistingField: true
    enableRichtext: true
    richtextConfiguration: 'default'
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'text'
    type: 'Textarea'
    rows: 4
    label: 'Text'
  -
    identifier: 'reverse'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Reverse'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
