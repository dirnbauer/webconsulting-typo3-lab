name: desiderio-grande/footer-page-meta
typeName: desiderio_grande_footerpagemeta
title: 'Page Meta Line'
description: 'Renders the housekeeping facts about a page as label and value pairs: when it was last reviewed, which version it is, who is responsible. Use it for: the foot of a documentation page, a policy document, a public authority page with a review duty, a technical guideline. Prefer ''Credits and Photo Notices'' when the subject is image rights, and ''Imprint Summary'' when the operator details are required.'
group: footer
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'text'
    type: 'Textarea'
    rows: 4
    label: 'Text'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: rows
    type: Collection
    foreign_table: desiderio_grande_label_value
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Entries'
    minitems: 1
    maxitems: 6
