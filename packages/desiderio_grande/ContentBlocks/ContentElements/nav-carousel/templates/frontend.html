<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-nav-carousel" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The track is a scroll-snap row that already works with keyboard and touch alone; the script only adds the arrow buttons and hides them when there is nothing left to scroll.
</f:comment>

<section class="astryx-section g-nav-carousel" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
