<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-pricing-plan-spotlight" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Only one spotlight per page; two of them cancel each other out. The image is optional and drops out first on narrow screens.
</f:comment>

<section class="astryx-section g-pricing-plan-spotlight" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
