<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-category-chips" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The child whose link resolves to the current page is rendered as selected with aria-current=page; the row wraps rather than scrolling.
</f:comment>

<section class="astryx-section g-category-chips" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
