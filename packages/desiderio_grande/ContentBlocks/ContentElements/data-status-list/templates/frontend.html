<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-status-list" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): The dot's colour comes from the child's icon key, so an editor never types a colour; write the 'as of' date into `note`, because the list says what someone published, not what is happening now.
</f:comment>

<section class="astryx-section g-data-status-list" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
