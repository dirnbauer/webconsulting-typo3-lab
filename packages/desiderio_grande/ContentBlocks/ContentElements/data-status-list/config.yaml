name: desiderio-grande/data-status-list
typeName: desiderio_grande_datastatuslist
title: 'Status List'
description: 'Renders a list of components or services, each with a state word, a coloured dot taken from its icon and an optional detail line. Use it for: a published service status page, a checklist of finished and open items, availability per system, audit findings. Prefer ''Uptime Strip'' when the history of a single service matters, and ''Progress Bars'' when each row is a percentage rather than a state.'
group: data
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: metrics
    type: Collection
    foreign_table: desiderio_grande_metric_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Entries'
    minitems: 2
    maxitems: 20
