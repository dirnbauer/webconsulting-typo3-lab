name: desiderio-grande/conversion-trial-signup
typeName: desiderio_grande_conversiontrialsignup
title: 'Trial Signup Band'
description: 'Renders the ask to start a free trial with the objections answered right next to the button: no card, cancel any time, how many days, how long setup takes. Use it for: SaaS landing pages, the end of a product tour, the band above a pricing table, a campaign page. Prefer ''Trial Terms Panel'' when the mechanics need a proper specification rather than three reassurances, and ''Demo Booking Band'' when a guided walk-through suits the audience better.'
group: conversion
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
