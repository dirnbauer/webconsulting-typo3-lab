<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-spec-table" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Column headings come from the labels this block gives the collection fields, so the editor fills rows and never types a header row.
</f:comment>

<section class="astryx-section g-data-spec-table" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
