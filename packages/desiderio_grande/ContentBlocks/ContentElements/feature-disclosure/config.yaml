name: desiderio-grande/feature-disclosure
typeName: desiderio_grande_featuredisclosure
title: 'Expandable Feature List'
description: 'Renders each entry as a closed row that opens on click to reveal its rich text, using native disclosure markup so no script is involved at all. Use it for: long capability inventories, technical detail that would swamp the page, regulation and policy explanations, feature pages with a knowledgeable minority of readers. Prefer ''Benefit List'' when everything should be visible at once, and ''Capability Tabs'' when only one entry should ever be open.'
group: features
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: entries
    type: Collection
    foreign_table: desiderio_grande_qa_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Entries'
    minitems: 2
    maxitems: 15
