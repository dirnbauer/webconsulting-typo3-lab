<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-progress-bars" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Pure CSS: the digits in each child's `value` become an inline custom property that sets the fill width — nothing is measured or scripted.
</f:comment>

<section class="astryx-section g-data-progress-bars" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
