<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-image-gallery" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Thumbnails are cropped to a shared ratio and link straight to the original file; no lightbox script is involved.
</f:comment>

<section class="astryx-section g-image-gallery" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
