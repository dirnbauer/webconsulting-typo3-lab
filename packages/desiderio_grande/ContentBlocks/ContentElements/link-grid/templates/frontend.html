<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-link-grid" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Descriptions and icons on the children are ignored on purpose — if they matter, the element is the wrong one.
</f:comment>

<section class="astryx-section g-link-grid" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
