name: desiderio-grande/contact-person
typeName: desiderio_grande_contactperson
title: 'Contact Person Panel'
description: 'Renders one named contact with a portrait, their role, the ways to reach them and the hours they are reachable. Use it for: the sales contact at the foot of a solution page, a press contact, the case handler on a service page. Prefer ''Person Profile'' when the biography matters more than the phone number, and ''Offices with Contacts'' when several locations each have their own person.'
group: team
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'text'
    type: 'Textarea'
    rows: 4
    label: 'Text'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Text'
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Text'
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'reverse'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Reverse'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
