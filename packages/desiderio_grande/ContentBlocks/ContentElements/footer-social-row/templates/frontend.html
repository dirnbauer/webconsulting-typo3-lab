<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-social-row" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Icons come from the shared icon library so switching library never rewrites a record; every icon link keeps an accessible name from its title.
</f:comment>

<section class="astryx-section g-footer-social-row" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
