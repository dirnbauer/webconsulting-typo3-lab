name: desiderio-grande/conversion-deadline-cta
typeName: desiderio_grande_conversiondeadlinecta
title: 'Deadline CTA'
description: 'Renders a call to action whose argument is time or scarcity: a figure with its unit — places left, days remaining — a written deadline in the small print, and a button. The date is typed by an editor rather than counted down, so it stays honest in a cached page. Use it for: early-bird rates, workshop seats, an application window, a discontinuation notice, a pre-order cut-off. Prefer ''Closing CTA Band'' for an offer with no end, and ''Waitlist Band'' when the date is not fixed yet.'
group: conversion
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
