<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-footer-questions-band" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Editors place this in the content area under whatever it should close; the template footer stays separate and untouched.

        </f:if>
    </div>
</section>

</html>
