<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-statement-band" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): header is rendered as a paragraph in display type, not as a heading, so it never disturbs the page outline.
</f:comment>

<section class="astryx-section g-statement-band" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
