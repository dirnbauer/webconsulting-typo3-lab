name: desiderio-grande/usage-counter-band
typeName: desiderio_grande_usagecounterband
title: 'Used By Counter'
description: 'Renders one dominating count with a short qualifying sentence and, underneath, a small row of customer marks. Use it for: total accounts, downloads or installations, the reassurance band above a sign-up form, a single memorable figure on a campaign page. Prefer ''Community Stats'' when four or five numbers together tell the story, and ''Logo Wall with Claim'' when the marks are the substance and the figure only the caption.'
group: social-proof
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'value'
    type: 'Textarea'
    rows: 1
    label: 'Value'
  -
    identifier: 'unit'
    type: 'Text'
    max: 24
    label: 'Unit'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
  -
    identifier: 'width'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Width'
    items:
      -
        label: 'Narrow'
        value: 'md'
      -
        label: 'Default'
        value: 'lg'
      -
        label: 'Wide'
        value: 'xl'
      -
        label: 'Full bleed'
        value: 'full'
    default: 'md'
  -
    identifier: 'compact'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Compact'
  -
    identifier: logos
    type: Collection
    foreign_table: desiderio_grande_logo_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Logos'
    maxitems: 8
