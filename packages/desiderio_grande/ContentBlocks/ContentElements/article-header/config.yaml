name: desiderio-grande/article-header
typeName: desiderio_grande_articleheader
title: 'Article Header'
description: 'Renders the opening block of an editorial page: eyebrow, title, standfirst, a byline with portrait and dateline, and a wide lead image with its credit. Use it for: the top of a news story, a blog post, a case study, a press release, a long-read feature. Prefer ''Section Break'' for a heading that opens a part inside a page, and ''Author Box'' when the byline belongs at the end rather than the top.'
group: content
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'caption'
    type: 'Textarea'
    rows: 1
    label: 'Caption'
  -
    identifier: 'author'
    type: 'Textarea'
    rows: 1
    label: 'Author'
  -
    identifier: 'role'
    type: 'Textarea'
    rows: 1
    label: 'Role'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'align'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Align'
    items:
      -
        label: 'Left'
        value: 'start'
      -
        label: 'Centred'
        value: 'center'
    default: 'start'
