<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-pricing-page-header" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Title goes in the core header column so the page module and search see a real title; note renders as small print under the lead, not as a banner.
</f:comment>

<section class="astryx-section g-pricing-page-header" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
