<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-feature-ribbon" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Child text is ignored here by design — only icon and title render — so the same records can be reused in a fuller grid.
</f:comment>

<section class="astryx-section g-feature-ribbon" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
