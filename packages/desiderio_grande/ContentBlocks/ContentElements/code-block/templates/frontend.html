<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-code-block" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): caption names the language or file; the panel scrolls sideways rather than wrapping, and there is no copy button because that would need a script.
</f:comment>

<section class="astryx-section g-code-block" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
