<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-downloads-list" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): A child's link may be a FAL file reference; when it is, the template prints the extension and file size and adds the download attribute.
</f:comment>

<section class="astryx-section g-downloads-list" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
