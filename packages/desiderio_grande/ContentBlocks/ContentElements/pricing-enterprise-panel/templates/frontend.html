<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-pricing-enterprise-panel" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): price is text, so 'On request' or 'Let us talk' sits in the same slot as a figure and stays aligned with the priced siblings.
</f:comment>

<section class="astryx-section g-pricing-enterprise-panel" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
