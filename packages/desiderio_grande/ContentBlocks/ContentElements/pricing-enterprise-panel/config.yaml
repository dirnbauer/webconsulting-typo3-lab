name: desiderio-grande/pricing-enterprise-panel
typeName: desiderio_grande_pricingenterprisepanel
title: 'Enterprise Panel'
description: 'Renders the tier that has no number: a panel saying what large customers get — security review, single sign-on, a named contact, custom terms, an invoice on account — and asking them to start a conversation instead of a checkout. Use it for: the fourth box beside three priced tiers, the foot of a plans page, a public-sector landing page. Prefer ''Plan Card'' when the price is public, and ''Quote Request Panel'' when the ask is a written estimate rather than a meeting.'
group: pricing
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: 'eyebrow'
    type: 'Textarea'
    rows: 1
    label: 'Eyebrow'
  -
    identifier: 'header'
    useExistingField: true
  -
    identifier: 'subheader'
    useExistingField: true
  -
    identifier: 'lead'
    type: 'Textarea'
    rows: 3
    label: 'Lead'
  -
    identifier: 'price'
    type: 'Textarea'
    rows: 1
    label: 'Price'
  -
    identifier: 'note'
    type: 'Textarea'
    rows: 2
    label: 'Note'
  -
    identifier: 'cta_label'
    type: 'Textarea'
    rows: 1
    label: 'Cta label'
  -
    identifier: 'cta_link'
    type: 'Link'
    label: 'Cta link'
  -
    identifier: 'secondary_label'
    type: 'Textarea'
    rows: 1
    label: 'Secondary label'
  -
    identifier: 'secondary_link'
    type: 'Link'
    label: 'Secondary link'
  -
    identifier: 'image'
    type: 'File'
    maxitems: 1
    allowed: 'common-image-types'
    label: 'Image'
  -
    identifier: 'columns'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Columns'
    items:
      -
        label: 'Two'
        value: '2'
      -
        label: 'Three'
        value: '3'
      -
        label: 'Four'
        value: '4'
    default: '2'
  -
    identifier: 'tone'
    type: 'Select'
    renderType: 'selectSingle'
    label: 'Tone'
    items:
      -
        label: 'Page background'
        value: 'body'
      -
        label: 'Raised surface'
        value: 'surface'
      -
        label: 'Muted'
        value: 'muted'
      -
        label: 'Accent'
        value: 'accent'
    default: 'body'
  -
    identifier: 'reverse'
    type: 'Checkbox'
    renderType: 'checkboxToggle'
    label: 'Reverse'
  -
    identifier: capabilities
    type: Collection
    foreign_table: desiderio_grande_icon_lead
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'What enterprise adds'
    maxitems: 8
