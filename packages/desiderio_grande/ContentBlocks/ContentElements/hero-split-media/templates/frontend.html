<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-split-media" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    TODO(grande): Text column caps at 60ch; the media column keeps its aspect ratio and is never cropped on narrow viewports.
</f:comment>

<section class="astryx-section g-hero-split-media" data-variant="{data.variant}">
    <div class="astryx-layout">
        <f:if condition="{data.header}">
            <h2 class="astryx-heading level-2">{data -> f:render.text(field: 'header')}</h2>
        </f:if>
    </div>
</section>

</html>
