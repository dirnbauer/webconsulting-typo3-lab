name: webconsulting/desiderio-grande
label: "Desiderio Grande Base (Astryx)"
hidden: true
# Desiderio is the engine underneath: the PAGE object, the PAGEVIEW data
# processors, the element library endpoint and the seeding services all come
# from it. This set replaces the visible layer — assets, page templates, theme
# attributes — and leaves that machinery alone.
dependencies:
  - webconsulting/desiderio
optionalDependencies:
  - typo3/fluid-styled-content
  - typo3/seo-sitemap
