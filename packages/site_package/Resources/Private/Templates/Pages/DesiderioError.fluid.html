<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Pages/Default"/>

<f:variable name="homeParameter" value="{breadcrumb.0.link -> f:or(alternative: 't3://page?uid={site.rootPageId}')}"/>
<f:variable name="homeUri" value="{f:uri.typolink(parameter: homeParameter)}"/>

<f:section name="Main">
    <section class="desiderio-system-page desiderio-system-page--error">
        <d:layout.container>
            <header class="desiderio-system-page__header">
                <h1>{page.pageRecord.title}</h1>
                <f:if condition="{page.pageRecord.abstract}">
                    <p>{page.pageRecord.abstract}</p>
                </f:if>
                <div class="desiderio-system-page__actions">
                    <d:atom.button href="{homeUri -> f:or(alternative: '/')}" variant="default">
                        <f:translate key="page.error.home" extensionName="desiderio">Back to homepage</f:translate>
                    </d:atom.button>
                </div>
            </header>
            <div class="desiderio-system-page__content">
                <!--TYPO3SEARCH_begin-->
                <f:if condition="{content.main}">
                    <f:render.contentArea contentArea="{content.main}"/>
                </f:if>
                <!--TYPO3SEARCH_end-->
            </div>
        </d:layout.container>
    </section>
</f:section>

</html>
