# Content canon for every site in the lab.
#
# One file that says what is true, how long things may be, which words are
# out, and how each site addresses its readers. The style guide explains the
# rules (docs/content/style-guide.md); this file is what the checks read:
#   - sitepackage:content:audit  (live database, per site)
#   - packages/site_package/Build/Scripts/lint-copy.php  (seed files before seeding)
#
# Facts carry the command or file that proves them. Change a fact only after
# re-running its source, never because existing copy says otherwise.

version: 1

# Limits a string must meet. "hard" fails the check, "soft" is reported.
limits:
  hard:
    page_title: { chars: 50 }
    headline: { chars: 60, words: 8 }
    eyebrow: { chars: 24, words: 3 }
    button: { chars: 24, chars_de: 28, words: 3, words_de: 4 }
    sentence: { words: 25 }
  soft:
    headline: { chars: 45 }
    lead: { sentences: 2, words: 30 }
    card: { words: 25 }
    faq_answer: { words: 60 }
    body: { words: 120 }
    meta: { min_chars: 110, max_chars: 155 }
    alt: { chars: 125 }
  page:
    avg_sentence_words: { en: 15, de: 13 }
    lix: { en: 40, de: 45 }

