# How each site speaks to its readers. Language codes are the site's
# default language; `address` is checked for German only.
sites:
  desiderio: { root: 505, language: en }
  corporate-starter: { root: 740, language: en }
  astryx: { root: 1290, language: en }
  agent-nexus: { root: 1400, language: en }
  camp: { root: 933, language: de, address: ihr }
  blog-classico: { root: 15, language: de, address: sie }
  v14-blog: { root: 69, language: en }
  typo3-blog: { root: 390, language: en }
  camino: { root: 99, language: en }

# German forms of address that each setting rejects.
address:
  sie: '\b(du|dich|dein|deine|deinen|deinem|deiner|deines|euch|euer|eure|euren|eurem|eurer)\b'
  ihr: '\b(du|dich|dein|deine|deinen|deinem|deiner|deines)\b'

# One word for one thing. Keys are rejected, values are what to write.
glossary:
  en:
    'e-mail': email
    'web site': website
    'back-end': backend
    'front-end': frontend
    'TYPO3 CMS 14': 'TYPO3 v14'
    'TYPO3 14': 'TYPO3 v14'
    'content block element': 'content element'
  de:
    'Backend-Bereich': 'Backend'
    'eMail': 'E-Mail'
    'Content-Element': 'Inhaltselement'
