# Words that make copy vague or loud. Hard: always rewrite. Soft: think twice.
banned:
  hard: ['world-class', 'revolutionary', 'revolutionise', 'game-changer', 'game-changing', 'cutting-edge', 'best-in-class', 'unleash', 'supercharge', 'next-level', 'state-of-the-art', 'unparalleled', 'stunning', 'blazing', 'magical', 'effortless', 'effortlessly']
  soft: ['seamless', 'seamlessly', 'powerful', 'robust', 'simply', 'easily', 'leverage', 'empower', 'unlock', 'elevate', 'journey', 'delightful']

# Leftovers from testing. Matched against headings and short fields.
leftovers:
  - '^\s*(test\d*|test new|dd|asdf|xxx|todo)\s*\.?\s*$'
  - '\blorem ipsum\b'
  - '\bEW GUI REVERT TEST\b'
  - '^\s*changed\s*:'
  - '\bheadeddr\b'
  - '\bSchipdddper\b'

