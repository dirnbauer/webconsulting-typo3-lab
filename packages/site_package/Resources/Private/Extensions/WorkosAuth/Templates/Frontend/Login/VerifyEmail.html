<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<section class="workos-auth-plugin workos-ui workos-ui--auth" aria-label="{f:translate(key: 'workos_auth.messages:frontend.verifyEmail.title')}">
    <f:if condition="{configured}">
        <f:then>
            <div class="workos-card" data-slot="card">
                <div class="workos-card__header" data-slot="card-header">
                    <h2 class="workos-card__title" id="workos-verify-email-title"><f:translate key="workos_auth.messages:frontend.verifyEmail.title" /></h2>
                    <p class="workos-card__description"><f:translate key="workos_auth.messages:frontend.verifyEmail.subtitle" arguments="{email: verifyEmail}" /></p>
                </div>

                <f:if condition="{authError}"><div class="workos-alert workos-alert--danger" role="alert" data-slot="alert">{authError}</div></f:if>
                <f:if condition="{notice}"><div class="workos-alert workos-alert--success" role="status" data-slot="alert">{notice}</div></f:if>

                <f:form action="verifyEmailSubmit" method="post" class="workos-form" requestToken="{requestToken}">
                    <label class="workos-field">
                        <span class="workos-label"><f:translate key="workos_auth.messages:frontend.verifyEmail.submit" /></span>
                        <input class="workos-input workos-input--code" data-slot="input" type="text" name="code" required="required" autofocus="autofocus" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" />
                    </label>
                    <button type="submit" class="workos-button workos-button--block" data-slot="button"><f:translate key="workos_auth.messages:frontend.verifyEmail.submit" /></button>
                </f:form>

                <f:if condition="{canResend}">
                    <div class="workos-footnote">
                        <f:translate key="workos_auth.messages:frontend.verifyEmail.noCode" />
                        <f:form action="verifyEmailResend" method="post" requestToken="{requestToken}">
                            <button type="submit" class="workos-link-button"><f:translate key="workos_auth.messages:frontend.verifyEmail.resend" /></button>
                        </f:form>
                    </div>
                </f:if>

                <p class="workos-footnote"><f:link.action action="show"><f:translate key="workos_auth.messages:frontend.magicauth.backToSignIn" /></f:link.action></p>
            </div>
        </f:then>
        <f:else>
            <div class="workos-alert workos-alert--warning" role="status" data-slot="alert"><f:translate key="workos_auth.messages:common.notConfigured" /></div>
        </f:else>
    </f:if>
</section>
</html>
