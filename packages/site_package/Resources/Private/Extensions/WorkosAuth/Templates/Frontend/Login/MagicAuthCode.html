<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<section class="workos-ui workos-ui--auth" aria-labelledby="workos-magic-code-title">
    <f:if condition="{configured}">
        <f:then>
            <div class="workos-card" data-slot="card">
                <div class="workos-card__header" data-slot="card-header">
                    <h2 class="workos-card__title" id="workos-magic-code-title"><f:translate key="workos_auth.messages:frontend.magicauth.checkEmail" /></h2>
                    <p class="workos-card__description"><f:translate key="workos_auth.messages:frontend.magicauth.codeSent" arguments="{email: magicAuthEmail}" /></p>
                </div>
                <f:form action="magicAuthVerify" method="post" class="workos-form" requestToken="{requestToken}">
                    <label class="workos-field">
                        <span class="workos-label"><f:translate key="workos_auth.messages:frontend.magicauth.verifyCode" /></span>
                        <input class="workos-input workos-input--code" data-slot="input" type="text" name="code" required="required" autofocus="autofocus" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" />
                    </label>
                    <button type="submit" class="workos-button workos-button--block" data-slot="button"><f:translate key="workos_auth.messages:frontend.magicauth.verifyCode" /></button>
                </f:form>
                <p class="workos-footnote"><f:link.action action="show"><f:translate key="workos_auth.messages:frontend.magicauth.backToSignIn" /></f:link.action></p>
            </div>
        </f:then>
        <f:else>
            <div class="workos-alert workos-alert--warning" role="status" data-slot="alert"><f:translate key="workos_auth.messages:common.notConfigured" /></div>
        </f:else>
    </f:if>
</section>
</html>
