<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab film</title>
<!--
  One page plays every overview film of the lab: film.html?film=docx-editor.
  The film is a spec in films/ (scenes, copy, images, footage) and its
  narration in audio/<id>/narration.json; lib/timeline.mjs turns both into
  times, so picture, voice and captions share one clock.

  Every motion is a paused Web Animation or a pure function of the time, so
  `seek(ms)` shows an exact frame: render-films.mjs steps through the film at
  30 fps in headless Chromium. #play plays it in real time, #t=12000 holds a
  frame. The look follows the templates film (packages/webcon_templates).

  The film opens on its start card (eyebrow, header, the lab's address),
  complete in the very first frame, because muted autoplay and a paused
  player show that frame; the scenes' own clock starts LEAD ms later
  (lib/timeline.mjs), so `seek(t)` shows scene time t - LEAD and every scene,
  line and caption keeps its timing. At the end the closing card stays on
  screen for TAIL ms more instead of fading to black: the last frame is the
  card.

  Paths: render-films.mjs serves the lab root at / and the film cache
  (~/.cache/lab-films) at /cache/. Images under vendor/ or packages/ come
  from the lab, everything else from /cache/footage/.
-->
<style>

@font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: block; src: url(/packages/webcon_templates/Resources/Public/Themes/QuietPages/Fonts/GeistMono-Variable.woff2) format("woff2"); }

@font-face { font-family: "Newsreader"; font-weight: 200 800; font-style: italic; font-display: block; src: url(/packages/webcon_templates/Resources/Public/Themes/QuietPages/Fonts/newsreader-latin-italic.woff2) format("woff2"); }

<body>
<div class="stage" id="stage">
  <canvas id="aura" width="1920" height="1080"></canvas>
</div>
<script type="module">
import { films } from './films/index.mjs';
import { HOST } from './films/feature-film.mjs';
import { LEAD, TAIL, cue, header, timeline } from './lib/timeline.mjs';

const params = new URLSearchParams(location.search);
const ID = params.get('film') ?? 'docx-editor';
const SPEC = films[ID];
if (!SPEC) throw new Error(`No film ${ID}`);
const FOOT = '/cache/footage/';
const src = (path) => (/^(vendor|packages|public)\//.test(path) ? `/${path}` : `${FOOT}${path}`);

const OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
const INOUT = 'cubic-bezier(0.77, 0, 0.175, 1)';
const SOFT = 'cubic-bezier(0.45, 0, 0.25, 1)';
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const custom = [];
const clips = [];
const check = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const arrow = '<svg viewBox="0 0 26 32"><path d="M2 2 L2 26 L8.5 20 L13 30 L17 28 L12.6 18.4 L21 18.4 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
if (SPEC.accent) document.documentElement.style.setProperty('--accent', SPEC.accent);

// ---------------------------------------------------------------------------
// Helpers (the templates film's)
// ---------------------------------------------------------------------------
function node(tag, cls, parent, html) {
  const element = document.createElement(tag);
  if (cls) element.className = cls;
  if (html != null) element.innerHTML = html;
  (parent ?? stage).append(element);
  return element;
}
function place(element, x, y, w, h) {
  Object.assign(element.style, { left: `${x}px`, top: `${y}px` });
  if (w != null) element.style.width = `${w}px`;
  if (h != null) element.style.height = `${h}px`;
  return element;
}
function track(element, steps) {
  const t0 = steps[0][0];
  const t1 = steps[steps.length - 1][0];
  const span = Math.max(1, t1 - t0);
  const frames = steps.map(([t, style, easing]) => ({ ...style, offset: (t - t0) / span, easing: easing ?? 'linear' }));
  element.animate(frames, { duration: span, delay: t0, fill: 'both' }).pause();
}
const pose = ({ x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1 } = {}) => `translate3d(${x}px, ${y}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
function life(element, tIn, tOut, { from = { y: 30 }, rest = {}, exit = { y: -16 }, blur = 9, inDur = 700, outDur = 420, ease = OUT, opacity = 1 } = {}) {
  const at = (p, b, o) => ({ opacity: o, transform: pose({ ...rest, ...p }), filter: `blur(${b}px)` });
  const steps = [[tIn, at(from, blur, 0), ease], [tIn + inDur, at({}, 0, opacity)]];
  if (tOut != null) steps.push([Math.max(tIn + inDur + 1, tOut - outDur), at({}, 0, opacity), INOUT], [Math.max(tIn + inDur + 2, tOut), at(exit, blur / 2, 0)]);
  track(element, steps);
}
function splitInto(element, html) {
  element.innerHTML = '';
  const holder = document.createElement('div');
  holder.innerHTML = html;
  const spans = [];
  const walk = (source, target, italic) => {
    for (const child of [...source.childNodes]) {
      if (child.nodeType === 3) {
        for (const part of child.textContent.split(/(\s+)/)) {
          if (part === '') continue;
          if (/^\s+$/.test(part)) { target.append(' '); continue; }
          const span = document.createElement(italic ? 'em' : 'span');
          span.style.display = 'inline-block';
          span.textContent = part;
          target.append(span);
          spans.push(span);
        }
      } else if (child.tagName === 'BR') {
        target.append(document.createElement('br'));
      } else {
        walk(child, target, child.tagName === 'EM' || italic);
      }
    }
  };
  walk(holder, element, false);
  return spans;
}
function rise(spans, start, step, until, { y = 0.36, blur = 9, duration = 680 } = {}) {
  spans.forEach((span, i) => {
    const t = start + i * step;
    const steps = [[t, { opacity: 0, transform: `translateY(${y}em)`, filter: `blur(${blur}px)` }, OUT], [t + duration, { opacity: 1, transform: 'translateY(0em)', filter: 'blur(0px)' }]];
    if (until) steps.push([Math.max(t + duration + 1, until[0] + i * 12), { opacity: 1, transform: 'translateY(0em)', filter: 'blur(0px)' }, INOUT], [Math.max(t + duration + 2, until[1] + i * 12), { opacity: 0, transform: `translateY(${-y / 2}em)`, filter: `blur(${blur / 2}px)` }]);
    track(span, steps);
  });
}
function words(tag, cls, parent, html, start, step, until, options) {
  const element = node(tag, cls, parent);
  rise(splitInto(element, html), start, step, until, options);
  return element;
}
function picture(path, parent, cls) {
  const img = document.createElement('img');
  if (path) img.src = src(path);
  img.alt = '';
  img.decoding = 'sync';
  if (cls) img.className = cls;
  parent.append(img);
  return img;
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (p) => 1 - Math.pow(1 - clamp(p), 4);
const smooth = (p) => { p = clamp(p); return p * p * (3 - 2 * p); };
const smoother = (p) => { p = clamp(p); return p * p * p * (p * (p * 6 - 15) + 10); };
const lerp = (a, b, p) => a + (b - a) * p;
const pad = (n, w = 4) => String(n).padStart(w, '0');
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

// ---------------------------------------------------------------------------
// Footage clips: an <img> showing the clip frame that belongs to the film time.
// ---------------------------------------------------------------------------
let FOOTAGE = {};
class Clip {
  constructor(parent, name) {
    this.name = name;
    this.meta = FOOTAGE[name] ?? { frames: 1 };
    this.windows = [];
    this.img = picture(null, parent);
    this.current = -1;
    clips.push(this);
  }
  /** Plays from film time `from` to `to`, starting at clip time `at` (ms). */
  play(from, to, at = 0, speed = 1) {
    this.windows.push([from, to, at, speed]);
    return this;
  }
  timeAt(t) {
    if (!this.windows.length) return 0;
    let best = this.windows[0];
    for (const w of this.windows) {
      if (t >= w[0] && t < w[1]) { best = w; break; }
      if (t >= w[1]) best = w;
    }
    const [from, to, at, speed] = best;
    return at + (clamp(t, from, to - 1) - from) * speed;
  }
  update(t) {
    const f = clamp(Math.floor((this.timeAt(t) * 30) / 1000 + 1e-6), 0, this.meta.frames - 1);
    if (f === this.current) return null;
    this.current = f;
    this.img.src = `${FOOT}${this.name}/${pad(f)}.jpg`;
    return this.img.decode().catch(() => {});
  }
}

// ---------------------------------------------------------------------------
// Aura and grain
// ---------------------------------------------------------------------------
const PALETTE = SPEC.palette ?? ['#c7863f', '#4a57ff', '#2c5a52'];
const auraCtx = $('aura').getContext('2d');
let AURA = [];
function auraAt(t) {
  let i = 0;
  while (i < AURA.length - 2 && t >= AURA[i + 1][0]) i++;
  const [t0, k0] = AURA[i];
  const [t1, k1] = AURA[Math.min(i + 1, AURA.length - 1)];
  return lerp(k0, k1, smooth((t - t0) / Math.max(1, t1 - t0)));
}
custom.push((t) => {
  const strength = auraAt(t);
  const s = t / 1000;
  auraCtx.globalCompositeOperation = 'source-over';
  auraCtx.fillStyle = '#070709';
  auraCtx.fillRect(0, 0, 1920, 1080);
  auraCtx.globalCompositeOperation = 'lighter';
  [
    [0.28 + 0.1 * Math.sin(s * 0.21), 0.36 + 0.1 * Math.cos(s * 0.17), 940],
    [0.74 + 0.09 * Math.cos(s * 0.19 + 1), 0.3 + 0.12 * Math.sin(s * 0.15 + 2), 840],
    [0.55 + 0.14 * Math.sin(s * 0.13 + 4), 0.82 + 0.08 * Math.cos(s * 0.23 + 1), 1030],
  ].forEach(([x, y, r], i) => {
    const [R, G, B] = hex(PALETTE[i % PALETTE.length]);

    gradient.addColorStop(0, `rgba(${R},${G},${B},${0.5 * strength})`);

// ---------------------------------------------------------------------------
// The camera: a view of W × H showing a source of the same aspect, scaled by
// s around (cx, cy) in source fractions, clamped so it never shows an edge.
// A rect [x, y, w, h] becomes the camera that frames it, height first.
// ---------------------------------------------------------------------------
let FOCUS = {};
const FULL = { s: 1, cx: 0.5, cy: 0 };
/**
 * The source is W wide and CH tall (CH > H for a portrait page in a landscape
 * view); rect fractions are of the source.
 */
function cameraFor(rect, max = 1.6, H = 1, CH = 1, crop = 1) {
  if (!rect || rect === 'full') return FULL;
  const [x, y, w, h] = rect;
  return { s: clamp(0.95 / Math.max((h * CH) / H, w * crop), 1, max), cx: x + w / 2, cy: y + h / 2 };
}
function applyCamera(cam, W, H, { s, cx, cy }, CH = H) {
  const tx = clamp(W / 2 - cx * W * s, W - W * s, 0);
  const ty = clamp(H / 2 - cy * CH * s, H - CH * s, 0);
  cam.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${s.toFixed(4)})`;
}
/** keys: [[filmTime, camera]], eased between neighbours. */
function cameraAt(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, a] = keys[i];
    const [t1, b] = keys[i + 1];
    if (t < t1) {
      const p = smoother((t - t0) / Math.max(1, t1 - t0));
      return { s: lerp(a.s, b.s, p), cx: lerp(a.cx, b.cx, p), cy: lerp(a.cy, b.cy, p) };
    }
  }
  return keys[keys.length - 1][1];
}

/**
 * A browser frame with a still or a clip, a camera and (for clips with a
 * recorded pointer) a cursor. Returns the frame box.
 */
function viewer(parent, scene, { x, y, w, aspect, url, tag, bare = false }) {
  const viewH = Math.round(w / aspect);
  const box = node('div', `frame${bare ? ' bare' : ''}`, parent, bare ? '<div class="frame-view"></div>' : `<div class="frame-bar"><i></i><i></i><i></i><span class="frame-url">${url ?? ''}</span><span class="frame-tag">${tag ?? ''}</span></div><div class="frame-view"></div>`);
  place(box, x, y, w, viewH + (bare ? 0 : 40));
  const view = box.querySelector('.frame-view');
  const cam = node('div', 'cam', view);
  place(cam, 0, 0, w, viewH);
  return { box, view, cam, W: w, H: viewH };
}

/** Puts a still or a clip with its camera into a viewer, for film time [a, b]. */
function film(v, source, a, b) {
  const CH = source.aspect ? v.W / source.aspect : v.H;
  v.cam.style.height = `${CH}px`;
  const frame = (rect, max) => cameraFor(rect, max, v.H, CH);
  if (source.clip) {
    const clip = new Clip(v.cam, source.clip);
    // segments: [[clipFrom, clipTo, speed]] played back to back from film time a.
    const segments = source.segments ?? [[source.from ?? 0, Infinity, source.speed ?? 1]];
    const map = [];
    let t = a;
    for (const [c0, c1, speed] of segments) {
      const length = c1 === Infinity ? Math.max(1, b - t) : (c1 - c0) / speed;
      map.push([t, c0, speed, length]);
      clip.play(t, t + length, c0, speed);
      t += length;
    }
    const toFilm = (ms) => {
      let seg = map[0];
      for (const s of map) if (ms >= s[1]) seg = s;
      return seg[0] + Math.min((ms - seg[1]) / seg[2], seg[3]);
    };
    const keys = (source.camera ?? [[segments[0][0], source.focus ?? 'full']]).map(([ms, rect]) => [toFilm(ms), frame(rect, source.max ?? 2.2)]);
    custom.push((t) => applyCamera(v.cam, v.W, v.H, cameraAt(keys, t), CH));
    const meta = FOOTAGE[source.clip];
    if (meta?.pointer?.length && source.cursor !== false) pointer(v, meta, clip, a, b);
    return clip;
  }
  const img = picture(source.image, v.cam);
  // A measured focus box may be cropped at the sides; a hand-set one is framed whole.
  const rect = source.focus ?? FOCUS[source.image];
  const end = source.focus ? frame(rect, source.max ?? 1.6) : cameraFor(rect, source.max ?? 1.6, v.H, CH, 0.8);
  const begin = source.pull ? end : { s: 1, cx: end.cx, cy: source.aspect ? end.cy : 0 };
  (source.marks ?? []).forEach(([x, y, w, h], i) => {
    const mark = node('div', '', v.cam);
    Object.assign(mark.style, { position: 'absolute', left: `${x * v.W}px`, top: `${y * CH}px`, width: `${w * v.W}px`, height: `${h * CH}px`, borderRadius: '6px', boxShadow: '0 0 0 3px var(--accent)', background: 'color-mix(in srgb, var(--accent) 20%, transparent)' });
    const at = a + (source.marksAt ?? 1500) + i * 350;
    track(mark, [[at, { opacity: 0, transform: 'scale(1.06)' }, OUT], [at + 450, { opacity: 1, transform: 'scale(1)' }]]);
  });
  const keys = source.camera
    ? source.camera.map(([p, r]) => [lerp(a, b, p), frame(r, source.max ?? 1.6)])
    : [[a + 200, source.pull ? end : begin], [b - 150, source.pull ? FULL : end]];
  custom.push((t) => applyCamera(v.cam, v.W, v.H, cameraAt(keys, t), CH));
  return img;
}

/** The recorded mouse path of a clip, drawn in the camera's coordinates. */
function pointer(v, meta, clip, a, b) {
  const k = v.W / meta.width;
  const cursor = node('div', 'cursor', v.cam, arrow);
  const ripples = (meta.clicks ?? []).map((at) => ({ at, el: node('div', 'ripple', v.cam) }));
  const path = meta.pointer;
  const posAt = (ms) => {
    let i = 0;
    while (i < path.length - 1 && path[i + 1][0] <= ms) i++;
    const [t0, x0, y0] = path[i];
    const [t1, x1, y1] = path[Math.min(i + 1, path.length - 1)];
    const p = t1 > t0 ? clamp((ms - t0) / (t1 - t0)) : 0;
    return [lerp(x0, x1, p) * k, lerp(y0, y1, p) * k];
  };
  custom.push((t) => {
    const ms = clip.timeAt(t);
    const visible = t > a + 150 && t < b - 150;
    const [x, y] = posAt(ms);
    const press = (meta.clicks ?? []).some((c) => ms >= c && ms < c + 160);
    cursor.style.opacity = visible ? '1' : '0';
    cursor.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${press ? 0.86 : 1})`;
    for (const { at, el } of ripples) {
      const p = (ms - at) / 520;
      const on = visible && p >= 0 && p <= 1;
      el.style.opacity = on ? String(1 - p) : '0';
      if (on) {
        const [cx, cy] = posAt(at);
        el.style.left = `${cx}px`;
        el.style.top = `${cy}px`;
        el.style.transform = `scale(${0.4 + 0.9 * ease(p)})`;
      }
    }
  });
}

  if (scene.install) {
    const install = node('div', 'install glass', copy, scene.install);
    life(install, start + 2500, null, { from: { y: 12 }, blur: 6 });
  }
  if (scene.note) life(node('div', 'end-note', copy, scene.note), start + 2800, null, { from: { y: 10 }, blur: 4 });
  // No fade to black: the card stays to the last frame (TAIL).
};

// ---------------------------------------------------------------------------
// Start card, before the scenes' clock starts (scene time -LEAD to 0): there
// complete in the first frame, then it leaves the way the scenes hand over,
// while the first scene comes in. Eyebrow and header as the page shows them,
// the lab's address as a small mark.
// ---------------------------------------------------------------------------
function start(duration) {
  const layer = node('section', 'layer start');
  const title = SPEC.scenes.find((scene) => scene.type === 'title');
  const eyebrow = node('div', 'eyebrow', layer, SPEC.card?.eyebrow ?? title?.eyebrow ?? 'For TYPO3 v14');
  // The name and "in 42 seconds" as two unbreakable halves: one line, or the
  // time on a line of its own.
  const text = header(SPEC, duration).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const [, name, time] = text.match(/^(.*?)\s+(in\s.+)$/) ?? [null, text, ''];
  const head = node('h1', 'start-head', layer);
  const spans = splitInto(node('span', '', head), name);
  if (time) {
    head.append(' ');
    spans.push(...splitInto(node('span', '', head), `<em>${time}</em>`));
  }
  for (let size = 124; size > 72 && Math.max(...[...head.children].map((half) => half.offsetWidth)) > 1560; size -= 4) head.style.fontSize = `${size - 4}px`;
  const mark = node('div', 'start-mark', layer, `<i></i>${HOST}`);
  const leave = (element, t, y, blur) => track(element, [
    [-LEAD, { opacity: 1, transform: 'translateY(0px)', filter: 'blur(0px)' }],
    [t, { opacity: 1, transform: 'translateY(0px)', filter: 'blur(0px)' }, INOUT],
    [t + 460, { opacity: 0, transform: `translateY(${y}px)`, filter: `blur(${blur}px)` }],
  ]);
  leave(eyebrow, -300, -10, 4);
  spans.forEach((span, i) => leave(span, -280 + i * 30, -18, 8));
  leave(mark, -300, 8, 4);
  // The shade behind the type goes with it.
  track(layer, [[-LEAD, { opacity: 1 }], [-200, { opacity: 1 }, SOFT], [400, { opacity: 0 }]]);
}

// ---------------------------------------------------------------------------
// HUD, aura keys, captions
// ---------------------------------------------------------------------------
function hud() {
  const chapters = TL.scenes.filter((scene) => scene.chapter);
  if (!chapters.length) return;
  const names = [...new Set(chapters.map((scene) => scene.chapter))];
  const spans = names.map((name) => {
    const own = chapters.filter((scene) => scene.chapter === name);
    return [own[0].start, own[own.length - 1].end];
  });
  const element = node('div', 'hud', stage, '<div class="hud-bars"></div><div class="hud-line"><b>01</b><span></span><em></em></div>');
  const bars = element.querySelector('.hud-bars');
  names.forEach(() => node('i', '', bars, '<s></s>'));
  element.querySelector('.hud-line span').textContent = `/ ${pad(names.length, 2)}`;
  const brand = node('div', 'hud-brand', stage, `<i></i>${SPEC.brand ?? SPEC.name}`);
  const tIn = spans[0][0];
  const tOut = spans[spans.length - 1][1];
  life(element, tIn + 300, tOut, { from: { y: -10 }, exit: { y: -10 }, blur: 4 });
  life(brand, tIn + 300, tOut, { from: { y: -10 }, exit: { y: -10 }, blur: 4 });
  const number = element.querySelector('b');
  const title = element.querySelector('em');
  custom.push((t) => {
    let index = spans.findIndex(([a, b]) => t >= a && t < b);
    if (index < 0) index = t < tIn ? 0 : spans.findLastIndex(([a]) => t >= a);
    if (index < 0) index = 0;
    const [a, b] = spans[index];
    number.textContent = pad(index + 1, 2);
    title.textContent = names[index];
    const p = clamp((t - a - 150) / 450);
    title.style.opacity = String(index === 0 ? 1 : ease(p));
    [...bars.children].forEach((bar, i) => {
      bar.firstChild.style.transform = `scaleX(${i < index ? 1 : i > index ? 0 : clamp((t - a) / (b - a))})`;
    });
  });
}

function aura() {
  const strength = { hook: 0.35, title: 0.85, shot: 0.55, points: 0.6, grid: 0.6, montage: 0.55, split: 0.55, end: 0.9 };
  // The start card in the title's light, which gives way to the first scene's.
  AURA = [[-LEAD, 0.85], [-400, 0.85]];
  for (const scene of TL.scenes) AURA.push([scene.start + 600, strength[scene.type] ?? 0.55]);
  AURA.push([TL.duration - 1200, 0.8]);
}

function subtitles() {
  for (const line of TL.lines) {
    const caption = node('div', 'subtitle', stage, line.show);
    const t0 = Math.max(0, line.at - 60);
    const t1 = Math.min(TL.duration, line.at + line.duration + 240);
    track(caption, [[t0, { opacity: 0 }, OUT], [t0 + 180, { opacity: 1 }], [t1 - 180, { opacity: 1 }, INOUT], [t1, { opacity: 0 }]]);
  }
}

/** Film time t: the scenes' clock runs LEAD ms behind it. */
window.seek = async (t) => {
  const scene = t - LEAD;
  for (const animation of document.getAnimations()) animation.currentTime = scene;
  for (const update of custom) update(scene);
  await Promise.all(clips.map((clip) => clip.update(scene)).filter(Boolean));
};
window.ready = (async () => {
  const json = async (url, fallback) => { try { const r = await fetch(url); return r.ok ? await r.json() : fallback; } catch { return fallback; } };
  const narration = await json(`audio/${ID}/narration.json`, null);
  FOOTAGE = await json(`${FOOT}footage.json`, {});
  FOCUS = await json('data/focus.json', {});
  TL = timeline(SPEC, narration);
  const DURATION = LEAD + TL.duration + TAIL;
  await Promise.all(['400 168px "Newsreader"', 'italic 400 168px "Newsreader"', '500 22px "Geist"', '500 17px "Geist Mono"'].map((font) => document.fonts.load(font)));
  for (const scene of TL.scenes) builders[scene.type](scene);
  start(DURATION);
  hud();
  aura();
  node('div', 'vignette');
  subtitles();
  // Film time throughout: lines and scenes LEAD later than on the scenes' clock.
  window.TIMELINE = {
    id: ID,
    duration: DURATION,
    lead: LEAD,
    content: TL.duration,
    lines: TL.lines.map(({ at, duration, end, file, show, say, measured }) => ({ at: at + LEAD, duration, end, file, show, say, measured })),
    scenes: TL.scenes.map(({ type, start, end, chapter }) => ({ type, start: start + LEAD, end: end + LEAD, chapter })),
  };
  window.POSTER_AT = LEAD + (SPEC.poster ?? (() => { const shot = TL.scenes.find((s) => s.type === 'shot' || s.type === 'montage') ?? TL.scenes[1] ?? TL.scenes[0]; return Math.round(shot.start + Math.min(3200, (shot.end - shot.start) * 0.6)); })());
  await document.fonts.ready;
  await Promise.all([...document.images].filter((img) => img.src).map((img) => img.decode().catch(() => {})));
  await window.seek(0);
  return DURATION;
})();
const hold = location.hash.match(/^#t=(\d+)/);
if (hold) window.ready.then(() => window.seek(Number(hold[1])));
if (location.hash === '#play') {
  window.ready.then((duration) => {
    const begin = performance.now();
    const tick = async () => { await window.seek((performance.now() - begin) % duration); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
