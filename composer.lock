                    "@ci",
                    "@ci:test:php:functional"
                ],
                "ci:test:agent-docs": [
                    "php Build/Scripts/check-agent-doc-symlinks.php"
                ],
                "ci:test:badges": [
                    "php Build/Scripts/check-badge-contrast.php"
                ],
