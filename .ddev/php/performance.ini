[PHP]
realpath_cache_size = 16384K
realpath_cache_ttl = 600

[opcache]
; DDEV's stock php.ini gives OPcache 500 MB. The generated TCA schema cache
; alone is a single 254 MB PHP file - two design systems put 593 content
; element subtypes into tt_content, and core var_exports a full copy of the
; CType column, items list and all, into every one of them. Caching that file
; left too little room for the other ~39k files, so OPcache hit its memory
; ceiling and restarted 91 times, dropping to a 67% hit rate and recompiling
; the whole codebase each time.
;
; Giving it room rather than excluding it is the right call: php-fpm shares one
; OPcache across workers, so the schema file is compiled once and every later
; request only executes it - 5-14 ms, against roughly a second to reparse it.
; Holding the literal arrays in shared memory also saves ~490 MB of heap on
; every request that touches TCA.
opcache.memory_consumption = 1024
opcache.interned_strings_buffer = 96
; The stock 1000000 sizes a hash table for a million scripts; this install
; caches roughly 40k.
opcache.max_accelerated_files = 65407
opcache.revalidate_freq = 2
opcache.file_update_protection = 0
; php-fpm keeps that shared memory alive between requests, but a CLI process
; gets its own OPcache and takes it to the grave, so every `typo3` command was
; recompiling the 255 MB schema cache from scratch - most of a 2.1 s bootstrap.
; The file cache persists compiled bytecode on disk between processes and brings
; that down to ~0.45 s, which the scheduler, the post-start warm hook and every
; `ddev exec vendor/bin/typo3` call pay. It also warms php-fpm's first request
; after a restart.
;
; /tmp keeps it inside the container and out of the Mutagen sync. The directory
; is created by .ddev/web-entrypoint.d/opcache-file-cache.sh.
opcache.file_cache = /tmp/opcache

[apcu]
apc.enable_cli = 1
apc.shm_size = 128M
