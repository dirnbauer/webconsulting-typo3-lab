[PHP]
; Two complete design systems are installed side by side — Desiderio's 244
; content elements and Astryx for TYPO3's 250 — and Content Blocks builds the
; TCA for every one of them on each frontend bootstrap. That crosses the 1 GB
; default while assembling the schema, and the request dies mid-render with a
; 200 already on the wire.
;
; This is a lab carrying an unusual amount of TCA, not a normal site: a
; production install running one theme stays far below the default.
memory_limit = 2G
