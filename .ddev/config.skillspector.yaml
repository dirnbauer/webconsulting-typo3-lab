# NVIDIA SkillSpector for EXT:skillspector's advisory review of nr_llm skills.
# The inspector discovers the binary through skillspectorBinary and uses
# `skillspector scan --format json --no-llm` unless LLM analysis is enabled.
#
# The tool is installed via pipx into the persistent ddev-global-cache volume,
# so container restarts only link the binary into the user's writable bin;
# the first start after this file is added takes a minute longer.
webimage_extra_packages: [pipx]
hooks:
  post-start:
    - exec: >-
        export PIPX_HOME=/mnt/ddev-global-cache/skillspector/pipx
        PIPX_BIN_DIR=/mnt/ddev-global-cache/skillspector/bin;
        test -x "$PIPX_BIN_DIR/skillspector"
        || pipx install 'git+https://github.com/NVIDIA/skillspector.git'
        || true;
        install -d "$HOME/.local/bin";
        ln -sf "$PIPX_BIN_DIR/skillspector" "$HOME/.local/bin/skillspector"
        || true
