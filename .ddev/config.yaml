name: webconsulting-typo3-lab
type: typo3
docroot: public
php_version: "8.5"
webserver_type: apache-fpm
xdebug_enabled: false
performance_mode: mutagen
database:
  type: mariadb
  version: "10.11"
upload_dirs:
  - fileadmin
  - ../node_modules
use_dns_when_possible: true
share_default_provider: cloudflared
composer_version: "2"
nodejs_version: "26.12.1"
ddev_version_constraint: ">= v1.25.4"
web_environment:
  - TYPO3_CONTEXT=Development/DDEV
  - PLAYWRIGHT_BROWSERS_PATH=/mnt/ddev-global-cache/playwright
corepack_enable: false

hooks:
  post-start:
    - exec: >-
        if [ "$(npm --version)" != "12.2.1" ]; then
          npm install --global npm@12.2.1;
        fi
    - exec-host: ddev solrctl apply
    - exec: >-
        mkdir -p var/log var/lock;
        nohup flock -n var/lock/desiderio-library-warm.lock
        vendor/bin/typo3 desiderio:library:warm
        > var/log/desiderio-library-warm.log 2>&1 </dev/null &
    # The Netresearch AI Chat runs its turns in `ai-chat:worker` processes
    # (processingStrategy=worker, packages/site_package/ext_localconf.php), as
    # in production: the same loop script docker/coolify/entrypoint.sh starts
    # there keeps one worker alive and restarts it whenever it ends. The lock
    # keeps a second `ddev start` from starting a second loop. Not a
    # web_extra_daemons entry: that rebuilds the web image on every change.
    - exec: >-
        mkdir -p var/log var/lock;
        nohup flock -n var/lock/ai-chat-worker.lock
        sh docker/coolify/ai-chat-worker.sh
        >> var/log/ai-chat-worker.log 2>&1 </dev/null &
