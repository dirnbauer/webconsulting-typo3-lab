name: webconsulting-typo3-lab
type: typo3
docroot: public
php_version: "8.4"
webserver_type: apache-fpm
xdebug_enabled: false
performance_mode: mutagen
database:
  type: mariadb
  version: "10.11"
upload_dirs:
  - fileadmin
  - ../node_modules
  - ../packages/flue-bridge/node_modules
  - ../vendor/webconsulting/docx-editor/node_modules
use_dns_when_possible: true
share_default_provider: cloudflared
composer_version: "2"
nodejs_version: "24"
ddev_version_constraint: ">= v1.25.3"
web_environment:
  - TYPO3_CONTEXT=Development/DDEV
  - PLAYWRIGHT_BROWSERS_PATH=/mnt/ddev-global-cache/playwright
corepack_enable: false

hooks:
  post-start:
    - exec-host: ddev solrctl apply
    - exec: >-
        mkdir -p var/log var/lock;
        nohup flock -n var/lock/desiderio-library-warm.lock
        vendor/bin/typo3 desiderio:library:warm
        > var/log/desiderio-library-warm.log 2>&1 </dev/null &
