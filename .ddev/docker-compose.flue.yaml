## Flue sidecar — real @flue/runtime (Node 22) bridging TYPO3 into durable AI
## agents/workflows. Hand-authored and user-managed. Modeled on
## docker-compose.typo3-solr.yaml. Reach TYPO3 from here by the Docker service
## name `web` (http://web/mcp), not the *.ddev.site host.
##
## NOTE: starting this service runs the third-party @flue/runtime beta. The
## Anthropic API key is NOT placed in this env — the webconsulting/flue control
## plane injects it per request (from nr-vault) at flow-trigger time.
services:
  flue:
    container_name: ddev-${DDEV_SITENAME}-flue
    hostname: ${DDEV_SITENAME}-flue
    image: node:22-bookworm
    # Keep Linux-native dependencies in a container volume instead of using the
    # macOS node_modules directory from the bind-mounted project.
    # chmod the shared skills volume so the web container's PHP user (SkillExporter)
    # can write exported SKILL.md dirs into the root-owned volume.
    command:
      - sh
      - -c
      - |
        set -eu
        chmod 0777 /app/.agents/skills 2>/dev/null || true
        cd /app
        lock_hash="$$(sha256sum package-lock.json | cut -d ' ' -f1)"
        if [ ! -f node_modules/.package-lock.sha256 ] || [ "$$(cat node_modules/.package-lock.sha256)" != "$$lock_hash" ]; then
          npm ci --no-audit --no-fund
          printf '%s\n' "$$lock_hash" > node_modules/.package-lock.sha256
        fi
        test -f flue.config.ts || npm run init
        exec npm run dev
    working_dir: /app
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    environment:
      # No HTTP_EXPOSE/VIRTUAL_HOST: the sidecar is reached only intra-DDEV by the
      # control plane (web container -> http://${DDEV_SITENAME}-flue:3583). `flue dev`
      # serves on its default port 3583 ("FLUE") and binds 0.0.0.0, so no host
      # port is published (avoids colliding with anything on the host, e.g. :3000).
      # Intra-DDEV: reach the TYPO3 web container by service name (avoids cert/DNS hops).
      - TYPO3_MCP_URL=http://web/mcp
      - SOLR_URL=http://${DDEV_SITENAME}-typo3-solr:8983
      # ANTHROPIC_API_KEY intentionally absent — injected per request by the control plane.
    volumes:
      - "../packages/flue-bridge:/app"
      - "flue-node-modules:/app/node_modules"
      # Flue auto-discovers Agent Skills under <cwd>/.agents/skills/ at context init;
      # the working_dir is /app, so the exported-skills volume MUST mount there (not /app/skills).
      - "flue-skills:/app/.agents/skills"
      - "flue-data:/app/data"
      - ".:/mnt/ddev_config"

  # Skill export from skillflow writes SKILL.md dirs into this shared volume (web side
  # /mnt/flue-skills); the flue container discovers them at /app/.agents/skills.
  web:
    volumes:
      - "flue-skills:/mnt/flue-skills"

volumes:
  flue-skills:
  flue-data:
  flue-node-modules:
