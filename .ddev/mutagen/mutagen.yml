# To override this file remove the line above
# and add your own configuration. If you override it you will
# probably want to check it in.
# Please do `ddev mutagen reset` after changing the file.
# See DDEV Mutagen docs at
# https://docs.ddev.com/en/stable/users/install/performance/#mutagen
# For detailed information about mutagen configuration options, see
# https://mutagen.io/documentation/introduction/configuration
sync:
  defaults:
    mode: "two-way-resolved"
    stageMode: "neighboring"
    ignore:
      paths:
        # The top-level .git directory is ignored because where possible it's
        # mounted into the container with a traditional docker bind-mount
        - "/.git"
        - "/.tarballs"
        - "/.ddev/db_snapshots"
        - "/.ddev/.importdb*"
        - ".DS_Store"
        - ".idea"
        - "/public/fileadmin"
        - "/public/typo3temp"
        - "/var"
        - "/node_modules"
        - "/packages/flue-bridge/node_modules"
        - "/vendor/webconsulting/docx-editor/node_modules"
        # The desktop apps are separate projects that happen to live in this
        # repository: nothing in composer.json or config/ refers to them, and
        # the TYPO3 container never runs them. Their build output is 1.65 GB of
        # the 1.8 GB under apps/ — a 349 MB Electron framework, a 193 MB .dmg,
        # a 187 MB .zip, a 116 MB native module — and pushing that through the
        # sync is what makes it time out mid-flush and drop files, which has
        # cost a vendor/autoload.php more than once.
        - "/apps/*/node_modules"
        - "/apps/*/dist"
        - "/apps/*/.next"
        - "/apps/*/out"
        - "/apps/news-api-studio/node_modules"
        - "/apps/news-api-studio/dist"
        - "/apps/news-api-studio/.next"
        - "/apps/news-api-studio/out"
        - "/apps/news-native-studio/node_modules"
        - "/apps/news-native-studio/dist"
        - "/apps/news-native-studio/.next"
        - "/apps/news-native-studio/out"
        # vcs like .git can be ignored for safety, but then some
        # composer operations may fail if they use dev versions/git.
        # vcs: true
    symlink:
      mode: "posix-raw"
