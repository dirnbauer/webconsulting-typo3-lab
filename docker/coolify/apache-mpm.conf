# Bound mod_php's memory. Without this file Apache runs prefork at its defaults:
# up to 150 workers that are never recycled. Here a worker that has rendered one
# TYPO3 request keeps 500-700 MB resident (1.2 GB while it compiles the ~250 MB
# TCA schema), because memory_limit has to be 2G for that schema to compile at
# all. On 2026-09-19 seventeen such workers held 3.1 GB on a 7.7 GB host shared
# with Redmine and Coolify; swap filled, load reached 188, the kernel OOM-killed
# Apache children and Solr's JVM in a loop, and the whole host had to reboot.
#
# So: few workers, recycled often. Workers x ~700 MB must fit under the web
# container's mem_limit in docker-compose.coolify.yml with room for one CLI run
# (scheduler, extension:setup). Tunable per environment without a rebuild; the
# defaults live in Dockerfile.coolify.
<IfModule mpm_prefork_module>
    StartServers            3
    MinSpareServers         2
    MaxSpareServers         4
    ServerLimit             ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers       ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild  ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>

# Off, not merely short. A kept-alive connection pins a whole prefork worker
# until the timeout, and Traefik does not send its next request down the
# connection a worker is waiting on - it queues it behind a new one. With 3
# workers and KeepAliveTimeout 2 the backend spent its time idle: 12 requests
# fired at once finished as 3 in 0.36 s and the rest in steps of ~2 s up to
# 15 s, and the 484 static files of the backend login page took 26 s (one of
# them 24.5 s) on a host at load 0.5. Traefik keeps the browser's connection
# alive at the edge; a fresh connection from Traefik to Apache on the same host
# costs next to nothing.
KeepAlive Off
