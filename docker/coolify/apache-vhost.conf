ServerName typo3-lab.webconsulting.at

<VirtualHost *:80>
    ServerName typo3-lab.webconsulting.at
    DocumentRoot /var/www/html/public

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Location />
        AuthType Basic
        AuthName "TYPO3 Lab"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/typo3-lab.htpasswd
        Require valid-user
    </Location>

    # Poppy authenticates its API with DPoP. HTTP Basic would consume the same
    # Authorization header and prevent any personal agent from connecting.
    # Only protocol discovery, verified API calls and the caller's PUBLIC keys
    # use this exemption. The playground and its assertion issuer keep Basic.
    <LocationMatch "^/(\.well-known/(poppy\.json|oauth-authorization-server/poppy)|poppy/(openapi\.json|token|revoke|knowledge|demo/(agent|jwks)\.json))$">
        AuthType None
        Require all granted
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
