ServerName typo3-lab.webconsulting.at

<VirtualHost *:80>
    ServerName typo3-lab.webconsulting.at
    DocumentRoot /var/www/html/public

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Location />
        AuthType Basic
        AuthName "TYPO3 Lab"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/typo3-lab.htpasswd
        # THE_REQUEST keeps the original URL after TYPO3 rewrites to index.php.
        # Poppy uses Authorization for DPoP, so its exact protocol paths must
        # bypass Basic even on the internal redirect. The demo UI and assertions
        # still require the lab login.
        <RequireAny>
            Require expr "%{THE_REQUEST} =~ m#^[A-Z]+[[:space:]]+/(\.well-known/(poppy\.json|oauth-authorization-server/poppy)|poppy/(openapi\.json|token|revoke|demo/(agent|jwks)\.json)|poppy/knowledge(\?topic=[a-z0-9_-]+)?)[[:space:]]+HTTP/#"
            Require valid-user
        </RequireAny>
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
