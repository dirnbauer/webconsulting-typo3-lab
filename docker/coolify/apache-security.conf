# Response hardening for the production image.
#
# The lab sits behind Traefik and answers 401 to anyone without the basic-auth
# login, so most of what the internet sees is that 401. `Header set` only
# touches successful responses, which is why public/.htaccess's nosniff never
# reached it: every header here goes into the `always` table, and the
# `onsuccess` copy is dropped first so PHP or .htaccess cannot double it.

# "Apache" instead of "Apache/2.4.x (Debian)", and no version on error pages.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    # Traefik redirects http to https and nothing here is served in the clear.
    # No includeSubDomains: this host does not speak for anything below it.
    Header onsuccess unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000"

    Header onsuccess unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"

    # SAMEORIGIN, not DENY: the backend and the visual editor frame the
    # frontend from the same origin.
    Header onsuccess unset X-Frame-Options
    Header always set X-Frame-Options "SAMEORIGIN"

    Header onsuccess unset Referrer-Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Nothing in the lab asks for these; a compromised script should not
    # be able to either.
    Header onsuccess unset Permissions-Policy
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    Header always unset X-Powered-By
    Header onsuccess unset X-Powered-By
</IfModule>
