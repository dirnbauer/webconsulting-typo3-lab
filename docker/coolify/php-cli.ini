; Read by the PHP CLI only (php-cli.ini takes the place of php.ini there; the
; conf.d files, zz-typo3-production.ini among them, still apply). Apache's
; mod_php never reads this file.
;
; Every `typo3` CLI process (entrypoint steps, the AI chat workers, a data run
; through `docker exec`) loads the generated TCA schema, a single PHP file of
; about 250 MB. Without a file cache each process compiles it again: measured
; in this image on 2026-11-21, a booted CLI process then holds 912 MB (peak
; 1257 MB), against 40 MB (peak 180 MB) with the cache. The AI chat workers
; check their own memory after boot and ended after every poll because of it.
; DDEV has the same setting (.ddev/php/performance.ini).
;
; The directory is created by Dockerfile.coolify (owner www-data, mode 0700)
; and emptied by the entrypoint at every start, so compiled code never outlives
; the container it was compiled in. PHP refuses to run any script when this
; directory is missing or not writable for the user: never point it elsewhere
; without creating the directory for www-data first.
opcache.file_cache=/tmp/opcache
