services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    environment:
      BASIC_AUTH_PASSWORD: ${SERVICE_PASSWORD_BASIC}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-lab}
      TYPO3_CONTEXT: Production
      # Entrypoint switches. Coolify injects only what this file declares, so
      # without these lines the documented overrides never reached the
      # container and the defaults could not be changed at all.
      TYPO3_RUN_SETUP: ${TYPO3_RUN_SETUP:-1}
      TYPO3_FLUSH_PAGE_CACHE: ${TYPO3_FLUSH_PAGE_CACHE:-1}
      TYPO3_CHAT_CLEANUP: ${TYPO3_CHAT_CLEANUP:-1}
      TYPO3_LOG_MAX_BYTES: ${TYPO3_LOG_MAX_BYTES:-52428800}
      # Workers x ~700 MB must stay under mem_limit below; see apache-mpm.conf.
      APACHE_MAX_REQUEST_WORKERS: ${APACHE_MAX_REQUEST_WORKERS:-6}
      APACHE_MAX_CONNECTIONS_PER_CHILD: ${APACHE_MAX_CONNECTIONS_PER_CHILD:-500}
      # Jev API token. webcon-jev:token:import reads it from the environment
      # and stores it in the vault; without the passthrough a value set in
      # Coolify never reaches the container.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPO3_DB_DATABASE: typo3
      TYPO3_DB_HOST: database
      TYPO3_DB_PASSWORD: ${SERVICE_PASSWORD_DB}
      TYPO3_DB_PORT: 3306
      TYPO3_DB_USER: ${SERVICE_USER_DB}
      TYPO3_MAIL_TRANSPORT: ${TYPO3_MAIL_TRANSPORT:-mbox}
      TYPO3_WORKOS_API_KEY: ${TYPO3_WORKOS_API_KEY:-}
      TYPO3_WORKOS_CLIENT_ID: ${TYPO3_WORKOS_CLIENT_ID:-}
      TYPO3_WORKOS_COOKIE_PASSWORD: ${TYPO3_WORKOS_COOKIE_PASSWORD:-}
      TYPO3_WORKOS_FRONTEND_DEFAULT_GROUP_UIDS: ${TYPO3_WORKOS_FRONTEND_DEFAULT_GROUP_UIDS:-}
      TYPO3_WORKOS_FRONTEND_STORAGE_PID: ${TYPO3_WORKOS_FRONTEND_STORAGE_PID:-0}
    depends_on:
      database:
        condition: service_healthy
      typo3-solr:
        condition: service_healthy
    volumes:
      - typo3_fileadmin:/var/www/html/public/fileadmin
      - typo3_runtime:/var/www/html/var
      - typo3_secrets:/run/typo3-secrets
    # Contain a memory runaway to this container. Without a limit the OOM is
    # global: on 2026-09-19 the kernel killed Solr, swap-thrashed Redmine and
    # Coolify, and the whole host rebooted. With one, the kernel kills a worker
    # inside this cgroup and Apache respawns it. Equal memswap_limit means no
    # swap for this container: fail fast instead of thrashing the host.
    #
    # Sized for APACHE_MAX_REQUEST_WORKERS (6) x ~700 MB resident = 4.2 GB, plus
    # 1.2 GB for one CLI run that compiles the TCA, so a scheduler or
    # extension:setup run fits while every worker is resident. On the 7.7 GB
    # host this was 3 workers under 2560m, where such a run did not fit; the
    # host has 15.6 GB since 2026-09-20. Raise the two together, and only with
    # the host's total in view: the other stacks hold limits of their own.
    mem_limit: 5632m
    memswap_limit: 5632m
    labels:
      - at.webconsulting.stack=typo3-lab
    restart: unless-stopped

  database:
    image: mariadb:10.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
      # The Content Blocks lab intentionally has a very wide tt_content table.
      # Match the DDEV setting so a complete dump can be restored.
      - --innodb-strict-mode=OFF
      # The database is ~320 MB of data and index. At the 128 MB default it
      # could not stay in memory; at 384 MB it does, with room to grow.
      - --innodb-buffer-pool-size=384M
    environment:
      MARIADB_DATABASE: typo3
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_DB}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT}
      MARIADB_USER: ${SERVICE_USER_DB}
    volumes:
      - typo3_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # A ceiling it should never meet, not a squeeze: 384 MB buffer pool plus
    # per-connection memory for six Apache workers sits near 650 MB. It exists
    # so that a runaway query hits this cgroup instead of Redmine. Raise it
    # before raising innodb_buffer_pool_size, never after.
    mem_limit: 1024m
    memswap_limit: 1024m
    labels:
      - at.webconsulting.stack=typo3-lab
    restart: unless-stopped

  typo3-solr:
    build:
      context: .
      dockerfile: Dockerfile.solr.coolify
    environment:
      SOLR_HEAP: 1g
      TYPO3_SOLR_ENABLED_CORES: english german hungarian chinese
    volumes:
      - typo3_solr:/var/solr/data
    # Solr was the most-killed process in the 2026-09-19 outage - 32 OOM kills -
    # and none of them were its fault: with no limit of its own it was simply
    # the largest thing on the host when Apache ran away. The heap is fixed at
    # 1g and the JVM sat at ~1.25 GB resident (metaspace, threads, direct
    # buffers) in every one of those kills, so 1536m is that plus headroom, not
    # a squeeze. Raise it together with SOLR_HEAP, never the heap alone: a heap
    # at or above the limit gets the JVM killed by the cgroup in a restart loop.
    mem_limit: 1536m
    memswap_limit: 1536m
    labels:
      - at.webconsulting.stack=typo3-lab
    restart: unless-stopped

volumes:
  typo3_database:
  typo3_fileadmin:
  typo3_runtime:
  typo3_secrets:
  typo3_solr:
