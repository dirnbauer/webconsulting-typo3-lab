name: Temporary Austrian register validation

on:
  push:
    branches:
      - tmp/austria-register-validation-20260710
    paths:
      - 'tools/tmp_austria_register/**'
      - '.github/workflows/tmp-austria-register-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/tmp_austria_register/**'
      - '.github/workflows/tmp-austria-register-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 lxml
      - run: python tools/tmp_austria_register/validate_school.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-validation
          path: validation-out/**
          if-no-files-found: error
          retention-days: 1
