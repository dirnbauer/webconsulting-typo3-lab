name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typo3-14-quality:
    name: TYPO3 14 quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, simplexml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-files-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      # The integration extensions live in their own repos and are gitignored here,
      # so a fresh checkout lacks the packages/* path packages composer expects.
      # Clone them so `composer install` can resolve the path repository.
      # PACKAGES_TOKEN (a PAT with read access) is only needed for any private repo;
      # public repos resolve with the default github.token.
      - name: Fetch path-package sources
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: |
          for spec in \
            "typo3-agent-nexus:agent_nexus"; do
            repo="${spec%%:*}"; dir="${spec##*:}"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/dirnbauer/${repo}.git" "packages/${dir}"
          done

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality suite
        run: Build/Scripts/runTests.sh -s ci
