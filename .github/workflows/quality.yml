name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typo3-14-quality:
    name: TYPO3 14 quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, simplexml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-files-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality suite
        run: Build/Scripts/runTests.sh -s quality

  node-quality:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install and audit root tools
        run: |
          npm ci
          npm audit --audit-level=high



  deploy:
    name: Deploy to typo3-lab.webconsulting.at
    # Only after both suites pass, and only for main. Coolify builds the image
    # itself, so a red commit that reached main must not become the live site.
    needs: [typo3-14-quality, node-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-typo3-lab
      cancel-in-progress: false
    steps:
      - name: Ask Coolify to redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://coolify.webconsulting.at' }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID || 'kj8tirxaijsk4cmzevgaphvr' }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::warning::COOLIFY_TOKEN is not set, so this commit was not deployed."
            echo "Add it under Settings > Secrets and variables > Actions to enable deployment."
            exit 0
          fi

          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}")

          if [ "${status}" = "401" ]; then
            echo "::error::Coolify rejected the token."
            exit 1
          fi
          if [ "${status}" != "200" ] && [ "${status}" != "201" ]; then
            echo "::error::Coolify answered ${status}: $(cat response.txt)"
            exit 1
          fi

          cat response.txt
          echo "Deployment queued for ${GITHUB_SHA}."
