name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typo3-14-quality:
    name: TYPO3 14 quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, simplexml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-files-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality suite
        run: Build/Scripts/runTests.sh -s ci

  node-quality:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/news-api-studio/package-lock.json
            packages/flue-bridge/package-lock.json

      - name: Install and audit root tools
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Check News API Studio
        working-directory: apps/news-api-studio
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
          npm run typecheck
          npm run build

      - name: Install and audit Flue bridge
        working-directory: packages/flue-bridge
        run: |
          npm ci
          npm audit --audit-level=high
