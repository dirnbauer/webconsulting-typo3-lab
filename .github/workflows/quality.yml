name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typo3-14-quality:
    name: TYPO3 14 quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: intl, mbstring, pdo_sqlite, simplexml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@12.2.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-files-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Configure private extension access
        env:
          GITLAB_EXTENSIONS_READ_KEY: ${{ secrets.GITLAB_EXTENSIONS_READ_KEY }}
        run: |
          if [ -z "$GITLAB_EXTENSIONS_READ_KEY" ]; then
            echo '::error::Set GITLAB_EXTENSIONS_READ_KEY to a read-only deploy key for the private TYPO3 Lab extension repositories.'
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp Build/SSH/known_hosts ~/.ssh/known_hosts
          printf '%s\n' "$GITLAB_EXTENSIONS_READ_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # The one check of the five Powermail patches GitHub can make without
      # the in2code code: each declared patch exists, is locked with its sha256
      # in patches.lock.json, and is a well-formed diff. It must run before the
      # drop below removes their declarations.
      - name: Check the patch declarations (including Powermail's)
        run: php Build/Scripts/check-patch-declarations.php

      # Powermail 14 and Powermail Conditions 14 come from in2code's Early
      # Access Packagist. Its token lives only in Coolify (build-only variable
      # IN2CODE_PACKAGIST_TOKEN) and on the developer's machine; GitHub has no
      # copy. This job therefore drops the two packages, their repository and
      # their patches from the runner's throw-away checkout and checks
      # everything else. Whether the five patches still apply, the in2code
      # audit and the Powermail tests are checked by `ddev check-powermail`
      # before each merge and by the Coolify image build
      # (docs/coolify-deployment.md).
      - name: Drop the licensed in2code packages from this checkout
        run: php Build/Scripts/ci-drop-private-packages.php

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality suite
        run: Build/Scripts/runTests.sh -s quality

  node-quality:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Use project npm version
        run: npm install --global npm@12.2.1

      - name: Install and audit root tools
        run: |
          npm ci
          npm audit --audit-level=high
          npm run test:tools

  # Deployment moved to GitLab CI on 2026-11-27: a push to main on GitLab
  # builds the images and deploys them (.gitlab-ci.yml). This workflow only
  # checks.
