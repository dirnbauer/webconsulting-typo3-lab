name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typo3-14-quality:
    name: TYPO3 14 quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, simplexml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-files-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Configure private extension access
        env:
          GITLAB_EXTENSIONS_READ_KEY: ${{ secrets.GITLAB_EXTENSIONS_READ_KEY }}
        run: |
          if [ -z "$GITLAB_EXTENSIONS_READ_KEY" ]; then
            echo '::error::Set GITLAB_EXTENSIONS_READ_KEY to a read-only deploy key for extensions/typo3-poppy.'
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp Build/SSH/known_hosts ~/.ssh/known_hosts
          printf '%s\n' "$GITLAB_EXTENSIONS_READ_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality suite
        run: Build/Scripts/runTests.sh -s quality

  node-quality:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install and audit root tools
        run: |
          npm ci
          npm audit --audit-level=high



  # Whether a deploy is even possible. This exists so the deploy job below can
  # be *skipped* rather than reporting a green tick it has not earned: a job
  # that exits 0 without deploying is indistinguishable, in the checks list and
  # in the commit status, from one that deployed — and this repository went
  # months with an unset token, every push showing "Deploy to
  # typo3-lab.webconsulting.at ✓" while the live site stayed on whatever commit
  # was last released by hand. Secrets cannot be read from a job-level `if`,
  # hence the extra job.
  deploy-gate:
    name: Deployment configured?
    needs: [typo3-14-quality, node-quality]
    # workflow_dispatch too, so main can be redeployed from the Actions UI
    # without an empty commit and without a laptop holding the token file.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Look for the Coolify token
        id: check
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          # The switch for CI deploys. Coolify's API is IP-allowlisted; while
          # it refused GitHub's runners every attempt ended in a 403, and a
          # deploy job that is red on every push teaches people to ignore red.
          # The allowlist admits the runners since 2026-09-20 and this variable
          # is 'true'. Turn deploys off again with
          #   gh variable set COOLIFY_CI_DEPLOY --body false
          COOLIFY_CI_DEPLOY: ${{ vars.COOLIFY_CI_DEPLOY }}
        run: |
          if [ -n "${COOLIFY_TOKEN}" ] && [ "${COOLIFY_CI_DEPLOY}" != "true" ]; then
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
            echo "::warning::This commit was NOT deployed: CI deploys are switched off (repository variable COOLIFY_CI_DEPLOY is not 'true') because Coolify's API allowlist rejects GitHub's runners. Deploy by hand with Build/Scripts/sync-coolify.sh deploy."
            {
              echo '### Not deployed'
              echo
              echo 'CI deploys are switched off: Coolify only answers its allowlisted IP, and GitHub runners are not on it.'
              echo 'Deploy from the allowlisted machine:'
              echo
              echo '```bash'
              echo 'Build/Scripts/sync-coolify.sh deploy'
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
            echo "::warning::COOLIFY_TOKEN is not set: this commit was NOT deployed, and the deploy job is skipped rather than green. Deploy by hand with Build/Scripts/sync-coolify.sh deploy, or add the secret under Settings > Secrets and variables > Actions."
            {
              echo '### Not deployed'
              echo
              echo 'No `COOLIFY_TOKEN` secret, so nothing was asked to redeploy and the deploy job below is skipped.'
              echo 'The live site stays on whichever commit was last deployed by hand:'
              echo
              echo '```bash'
              echo 'Build/Scripts/sync-coolify.sh deploy'
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    name: Deploy to typo3-lab.webconsulting.at
    # Only after both suites pass, and only for main. Coolify builds the image
    # itself, so a red commit that reached main must not become the live site.
    # Skipped outright when no token is configured — see deploy-gate.
    needs: [deploy-gate]
    if: needs.deploy-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Waits for Coolify to build and start the new image (up to 30 minutes).
    timeout-minutes: 35
    concurrency:
      group: deploy-typo3-lab
      cancel-in-progress: false
    steps:
      - name: Ask Coolify to redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://coolify.webconsulting.at' }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID || 'kj8tirxaijsk4cmzevgaphvr' }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::COOLIFY_TOKEN vanished between the gate and this job."
            exit 1
          fi

          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}")

          if [ "${status}" = "401" ]; then
            echo "::error::Coolify rejected the token: it is wrong, expired or revoked."
            exit 1
          fi
          # 403 {"message":"You are not allowed to access the API."} is Coolify's
          # IP allowlist (Settings > Configuration > Allowed IPs), not the token:
          # the same token and call answer 200 from the one allowlisted address.
          # GitHub-hosted runners come from Azure ranges that are never on that
          # list. Print the rejected address so nobody re-derives this.
          if [ "${status}" = "403" ]; then
            runner_ip=$(curl -sS --max-time 10 https://api.ipify.org || echo unknown)
            if grep -q 'not allowed to access the API' response.txt; then
              echo "::error::Coolify's API IP allowlist rejected this runner (${runner_ip}). The token is not the problem. Deploy by hand from an allowlisted machine with Build/Scripts/sync-coolify.sh deploy — see docs/coolify-deployment.md for the options."
            else
              echo "::error::Coolify refused the deploy call from ${runner_ip}. If the token lacks the 'deploy' permission, recreate it at ${COOLIFY_URL}/security/api-tokens. Response: $(cat response.txt)"
            fi
            exit 1
          fi
          if [ "${status}" != "200" ] && [ "${status}" != "201" ]; then
            echo "::error::Coolify answered ${status}: $(cat response.txt)"
            exit 1
          fi

          cat response.txt
          echo "Deployment queued for ${GITHUB_SHA}."

      # The host keeps the last three deployed versions (user rule, 2026-10-10).
      # Coolify's retention is set to 6 images (web + Solr per version), but it
      # applies it only in its nightly cleanup, so several deploys in one day
      # used to pile up until the disk was full. Run that cleanup now.
      - name: Wait for the deployment, then keep the last three versions
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://coolify.webconsulting.at' }}
          COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID || 'j2islqjevpoywpdmlpbzrnsy' }}
        run: |
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' response.txt)
          if [ -z "${deployment_uuid}" ]; then
            echo "::warning::Coolify returned no deployment id, so there is nothing to wait for. The nightly cleanup keeps three versions."
            exit 0
          fi

          state=""
          for _ in $(seq 1 90); do
            code=$(curl -sS -o deployment.json -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${deployment_uuid}" || echo 000)
            # "Deployment already queued for this commit" hands out an id that
            # Coolify then answers 404 for; the other run cleans up after it.
            if [ "${code}" = "404" ]; then
              echo "::warning::Coolify does not know deployment ${deployment_uuid} (already queued for this commit?). Not waiting."
              exit 0
            fi
            state=$(jq -r '.status // empty' deployment.json 2>/dev/null || true)
            case "${state}" in
              finished|failed|cancelled|cancelled-by-user) break ;;
            esac
            sleep 20
          done

          if [ "${state}" != "finished" ]; then
            echo "::error::Coolify deployment ${deployment_uuid} ended as '${state:-unknown}'; the previous image keeps serving."
            exit 1
          fi
          echo "Deployment ${deployment_uuid} finished."

          status=$(curl -sS -o cleanup.txt -w '%{http_code}' --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"delete_unused_volumes":false,"delete_unused_networks":false}' \
            "${COOLIFY_URL}/api/v1/servers/${COOLIFY_SERVER_UUID}/docker-cleanup/run" || echo 000)
          case "${status}" in
            200|201|202)
              echo "Coolify cleanup started: older versions than the last three are removed." ;;
            403)
              echo "::warning::Coolify refused the cleanup (the token needs the 'write' permission): $(cat cleanup.txt). The nightly cleanup still keeps three versions." ;;
            *)
              echo "::warning::Coolify cleanup answered ${status}: $(cat cleanup.txt). The nightly cleanup still keeps three versions." ;;
          esac
