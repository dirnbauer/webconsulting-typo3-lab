policy:
  name: "TYPO3 Demo API Policy"
  deny:
    - xclass:override
    - network:outbound:any
  review_required:
    - auth:provider
    - site:middleware
    - network:outbound
  max_risk_score: 12
  require_manifest: true

api_definitions:
  -
    id: "news"
    versions:
      - "1"
    security:
      authMode: "token"
      authProviders:
        - "backendbeareropaquetokenprovider"
      cors:
        allowedOrigins:
          - "http://localhost:3000"
          - "http://localhost:3001"

api_resources:
  -
    label: "News CRUD"
    extension: "news"
    manifest: "config/capabilities/news/Capabilities.yaml"
    api: "news"
    version: 1
    table: "tx_news_domain_model_news"
    basePath: "/news"
    options:
      allowedOperations:
        - list
        - get
        - create
        - update
        - delete
      readFields: []
      writeFields: []
      deleteMode: "soft"
      includeDisabled: true
      tags:
        - "News"
      requiredScopes:
        list:
          - "news:read"
        get:
          - "news:read"
        create:
          - "news:write"
        update:
          - "news:write"
        delete:
          - "news:write"
      fieldConfiguration:
        sys_file_reference:
          allowed:
            - uid
            - uid_local
            - title
            - alternative
            - description
            - crop
