# Site-wide execution policy for the abilities registry
# (webconsulting/typo3-abilities). Applies to EVERY surface an ability is
# executed on: CLI (abilities:run), MCP (ability_* tools), REST
# (/api/abilities/v1), and optional desktop clients.
#
# Rule grammar: exact ability name, "namespace/*", "*", "risk:<tier>",
# "scope:<scope>" (prefix), "side-effect:<subsystem>" (prefix).
# deny always wins; review_required blocks unless the execution context
# carries an explicit human approval (for example CLI --approve-review or a
# client-side publish confirmation); max_risk_tier caps the tier outright.
policy:
  name: "webconsulting lab abilities policy"
  deny:
    # No ability may reach out to the network — content operations are local.
    - "side-effect:network:outbound"
  review_required:
    # Publishing to live is the human-in-the-loop showcase: high-risk
    # abilities (e.g. workspaces/publish, destructive deletes) need an
    # explicit approval from the calling surface.
    - "risk:high"
  max_risk_tier: "high"
