# Shared route enhancers for ALL lab sites: human-readable URLs for
# georgringer/news and in2code/powermail. Imported by every
# config/sites/*/config.yaml via:
#   imports:
#     - { resource: '../../shared/route-enhancers.yaml' }
#
# A site can override an enhancer by redefining the same key in its own
# config.yaml (the site file wins on import merge). The solr facet enhancer
# is NOT shared because it needs a per-site limitToPages (its catch-all
# route path would otherwise swallow unknown URL segments).
routeEnhancers:
  News:
    type: Extbase
    extension: News
    plugin: Pi1
    routes:
      -
        routePath: /
        _controller: 'News::list'
      -
        routePath: '/page-{page}'
        _controller: 'News::list'
        _arguments:
          page: currentPage
      -
        routePath: '/category/{category-name}/page-{page}'
        _controller: 'News::list'
        _arguments:
          category-name: overwriteDemand/categories
          page: currentPage
      -
        routePath: '/category/{category-name}'
        _controller: 'News::list'
        _arguments:
          category-name: overwriteDemand/categories
      -
        routePath: '/tag/{tag-name}/page-{page}'
        _controller: 'News::list'
        _arguments:
          tag-name: overwriteDemand/tags
          page: currentPage
      -
        routePath: '/tag/{tag-name}'
        _controller: 'News::list'
        _arguments:
          tag-name: overwriteDemand/tags
      -
        routePath: '/article/{news-title}'
        _controller: 'News::detail'
        _arguments:
          news-title: news
    defaultController: 'News::list'
    defaults:
      page: '0'
    aspects:
      news-title:
        type: NewsTitle
      page:
        type: StaticRangeMapper
        start: '1'
        end: '100'
      category-name:
        type: NewsCategory
      tag-name:
        type: NewsTag
  Powermail:
    type: Extbase
    extension: Powermail
    plugin: Pi1
    routes:
      -
        routePath: '/confirmation'
        _controller: 'Form::confirmation'
      -
        routePath: '/create'
        _controller: 'Form::create'
      -
        routePath: '/optin/{mail}/{hash}'
        _controller: 'Form::optinConfirm'
        _arguments:
          mail: mail
          hash: hash
      -
        routePath: '/disclaimer/{mail}/{hash}'
        _controller: 'Form::disclaimer'
        _arguments:
          mail: mail
          hash: hash
    defaultController: 'Form::form'
    requirements:
      mail: '\d+'
      hash: '[a-zA-Z0-9_-]+'
