plugin:
  tx_blog:
    settings:
      blogUid: 15
      categoryUid: 17
      tagUid: 18
      authorUid: 19
      archiveUid: 20
      storagePid: 16
      # A comment shows on the post in the language it was written in. The
      # example comments are German, so the English and Chinese posts no
      # longer list them (EXT:blog shows every comment on every translation
      # by default).
      comments:
        respectPostLanguageId: 1
desiderio:
  shadcn:
    preset: b6G5977cw
    style: radix-lyra
    iconLibrary: tabler
  news:
    useLoadMore: true
  theme:
    darkModeDefault: light

# Visual Editor element library: no desiderio frontend on this site, so it shares
# the corporate library (folder 1026); previews resolve via the corporate site.
elementLibrary.storagePid: 1026
elementLibrary.hosts: 'desiderio,innesto,core'

# Slug changes are permanent (the content rewrite of 2026-09 moved posts to
# new slugs), so the redirects TYPO3 creates for them say so.
redirects:
  httpStatusCode: 301
