base: 'https://webconsulting-typo3-lab.ddev.site/desiderio-corporate-starter/'
baseVariants:
  -
    base: 'https://typo3-lab.webconsulting.at/desiderio-corporate-starter/'
    condition: 'applicationContext == "Production"'
dependencies:
  - webconsulting/site-package-search
  - webconsulting/desiderio-preset-corporate
  - webconsulting/skillflow-solr
  - webconsulting/agent-nexus
  - webconsulting/desiderio
  - webconsulting/lab-statistics
solr_enabled_read: true
solr_host_read: typo3-solr
solr_path_read: /
solr_port_read: '8983'
solr_scheme_read: http
solr_core_read: core_en
solr_use_write_connection: false
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=749'
languages:
  -
    languageId: 0
    title: English
    navigationTitle: English
    locale: en_US.UTF-8
    base: /
    flag: us
    iso-639-1: en
    fallbackType: strict
rootPageId: 740
routeEnhancers:
  # The skill detail page (1066) moved to the desiderio site with its
  # SkillDetail enhancer (/ai/agentic-skills/find/skill/<name>/).
  PageTypeSuffix:
    type: PageType
    default: /
    index: ''
    map:
      sitemap.xml: 1533906435
      robots.txt: 201
websiteTitle: 'Northstar Advisory Group'
imports:
  -
    resource: '../../shared/route-enhancers.yaml'
  -
    resource: 'EXT:blog/Configuration/Routes/Default.yaml'
