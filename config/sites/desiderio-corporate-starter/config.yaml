base: 'https://webconsulting-typo3-lab.ddev.site/desiderio-corporate-starter/'
baseVariants:
  -
    base: 'https://typo3-lab.webconsulting.at/desiderio-corporate-starter/'
    condition: 'applicationContext == "Production"'
dependencies:
  - webconsulting/site-package-search
  - webconsulting/desiderio-preset-corporate
  - webconsulting/skillflow-solr
  - webconsulting/site-package-agentstack
solr_enabled_read: true
solr_host_read: typo3-solr
solr_path_read: /
solr_port_read: '8983'
solr_scheme_read: http
solr_core_read: core_en
solr_use_write_connection: false
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=749'
languages:
  -
    languageId: 0
    title: English
    navigationTitle: English
    locale: en_US.UTF-8
    base: /
    flag: us
    iso-639-1: en
    fallbackType: strict
rootPageId: 740
routeEnhancers:
  SkillDetail:
    type: Extbase
    extension: Skillflow
    plugin: SkillDetail
    limitToPages:
      - 1066
    routes:
      - routePath: '/{skill}'
        _controller: 'SkillDetail::show'
    defaultController: 'SkillDetail::show'
    aspects:
      skill:
        type: PersistedAliasMapper
        tableName: tx_nrllm_skill
        routeFieldName: name
  SolrSearch:
    type: SolrFacetMaskAndCombineEnhancer
    extensionKey: tx_solr
    limitToPages:
      - 748
    solr:
      query:
        concat: true
        mask: true
        map:
          type: type
    routePath: '/{type}'
    _arguments:
      type: filter-type
    requirements:
      type: '.*'
  PageTypeSuffix:
    type: PageType
    default: /
    index: ''
    map:
      sitemap.xml: 1533906435
      robots.txt: 201
settings:
  elementLibrary.storagePid: 1026
  desiderio.brand.wordmark: 'Northstar Advisory'
  desiderio.brand.tagline: 'Operational change, made legible.'
  desiderio.seo.defaultDescription: 'Northstar Advisory Group starter website for procurement-ready B2B service positioning, proof, governance, and contact paths.'
  desiderio.tracking.enabled: false
  desiderio.seo.robotsTxtEnabled: true
  desiderio.seo.sitemapPath: sitemap.xml
  desiderio.search.targetPageId: '748'
  desiderio.footer.legalPageIds: '750,751,752'
  desiderio.consent.privacyPageId: '751'
websiteTitle: 'Northstar Advisory Group'
imports:
  -
    resource: '../../shared/route-enhancers.yaml'
  -
    resource: 'EXT:blog/Configuration/Routes/Default.yaml'
