base: 'https://webconsulting-typo3-lab.ddev.site/agent-nexus/'
baseVariants:
  -
    base: 'https://typo3-lab.webconsulting.at/agent-nexus/'
    condition: 'applicationContext == "Production"'
dependencies:
  # The plain agent-nexus set only wraps the plugins; Desiderio supplies
  # page = PAGE and the shadcn/ui page layouts. (agent-nexus 4 deprecated the
  # agent-nexus-desiderio set that used to pull these two in.)
  - webconsulting/agent-nexus
  - webconsulting/desiderio
  - webconsulting/desiderio-shadcnui-templates
errorHandling: {  }
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
rootPageId: 1400
routes: {  }
# The Agent Nexus site is a protocol showcase with no search page. Indexing it
# would leave a permanent backlog in the queue (no worker task is configured for
# this root), so Solr stays off here.
solr_enabled_read: false
