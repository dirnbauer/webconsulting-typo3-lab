plugin:
  tx_blog:
    settings:
      blogUid: 390
      categoryUid: 392
      tagUid: 393
      authorUid: 394
      archiveUid: 395
      storagePid: 391

# Visual Editor element library: no desiderio frontend on this site, so it shares
# the corporate library (folder 1026); previews resolve via the corporate site.
elementLibrary.storagePid: 1026
elementLibrary.hosts: 'desiderio,innesto,core'

# Slug changes are permanent (the content rewrite of 2026-09 moved posts to
# new slugs), so the redirects TYPO3 creates for them say so.
redirects:
  httpStatusCode: 301
